name: Spacetoon Auto Update

on:
  schedule:
    - cron: '0 * * * *' # تشغيل تلقائي كل ساعة
  workflow_dispatch: # زر للتشغيل اليدوي

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Run Scraper
        run: python scraper.py
