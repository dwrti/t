name: Movie Updater Bot

on:
  workflow_dispatch: 

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Update Movie Link
        run: |
          # التأكد من وجود ملف HTML، وإذا لم يوجد سيقوم البوت بإنشائه فوراً
          if [ ! -f index.html ]; then
            echo "<h1>قائمة الأفلام</h1><video id='player' src='https://vjs.zencdn.net/v/oceans.mp4'></video>" > index.html
          fi
          
          # تحديث رابط الفيلم (كمثال)
          sed -i 's|https://vjs.zencdn.net/v/oceans.mp4|https://www.w3schools.com/html/mov_bbb.mp4|g' index.html

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "تم تحديث الفيلم بنجاح 🎬" || echo "لا توجد تغييرات لإضافتها"
          git push
