name: Horror Movie Bot

on:
  workflow_dispatch: # للتشغيل اليدوي بضغطة زر

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        # هنا التعديل: أضفنا مكتبة الترجمة لكي يفهمها البوت
        run: |
          python -m pip install --upgrade pip
          pip install requests deep-translator

      - name: Run Bot
        env:
          # تأكد أن هذا الاسم مطابق لما وضعته في الـ Secrets
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python horror_bot.py
