name: Horror Movie Bot

on:
  workflow_dispatch: # للتشغيل اليدوي
  schedule:
    # التعديل هنا: '*/15' تعني التشغيل كل 15 دقيقة
    - cron: '*/15 * * * *' 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests deep-translator

      - name: Run Bot
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python horror_bot.py
