name: Movie Email Bot

# تشغيل البوت تلقائياً كل دقيقة
on:
  schedule:
    - cron: '* * * * *' #
  workflow_dispatch: # للتشغيل اليدوي في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. جلب الأكواد (أطفالك) من المستودع
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. إعداد بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. تثبيت المكتبة المطلوبة لإرسال البيانات
      - name: Install dependencies
        run: pip install requests

      # 4. تشغيل البوت لإرسال الإيميل
      - name: Run Bot
        run: python bot.py
