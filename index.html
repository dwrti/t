<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺 - IPTV</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .card { 
            position: sticky; top: 0; z-index: 1000; 
            background: #000; width: 100%; max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            background: #0a0a0a; color: #fff; box-sizing: border-box;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; }
        .btn-sync.inactive { background-color: #b71c1c; }

        /* تنسيق المجموعات والقنوات */
        #librarySection { width: 95%; max-width: 700px; margin: 20px auto 100px auto; }
        
        .group-container { margin-bottom: 10px; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
        .group-header { 
            background: #111; padding: 15px; cursor: pointer; 
            font-weight: bold; display: flex; justify-content: space-between;
        }
        .group-content { display: none; background: #050505; }
        .group-content.show { display: block; }

        .channel-item { 
            padding: 12px 20px; border-bottom: 1px solid #111; 
            cursor: pointer; font-size: 14px; color: #ccc;
        }
        .channel-item:hover { background: #1a1a1a; color: #fff; }

        #searchBox { margin-bottom: 15px; border-color: #333; }
        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">عدد المتصلين: --</div>
        
        <div style="background: #0a0a0a; padding: 10px; border-radius: 8px; border: 1px solid #1a1a1a;">
            <input type="text" id="m3uUrlInput" placeholder="ضع رابط ملف M3U المباشر هنا...">
            <div style="display: flex; gap: 5px;">
                <button onclick="loadM3UFromUrl()" style="background: #1a3a8a;">تحميل من الرابط</button>
                <button onclick="document.getElementById('fileInput').click()" style="background: #333;">رفع ملف من الهاتف</button>
            </div>
            <input type="file" id="fileInput" style="display:none" accept=".m3u,.m3u8" onchange="loadM3UFromFile(event)">
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="clearLibrary()" style="color: #ff5252;">مسح كل القنوات 🗑️</button>
        </div>
        <div id="statusText">تم التحديث ✅</div>
    </div>

    <div id="librarySection">
        <input type="text" id="searchBox" placeholder="🔍 ابحث عن قناة..." oninput="filterChannels()">
        <div id="channelsContainer"></div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);
        var allChannels = []; // لتخزين القنوات محلياً للبحث

        // --- وظائف IPTV ---

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentGroup = "غير مصنف";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) currentGroup = groupMatch[1];
                    
                    const name = line.split(',').pop();
                    const url = lines[i + 1] ? lines[i + 1].trim() : "";
                    
                    if (url && !url.startsWith('#')) {
                        channels.push({ name, url, group: currentGroup });
                    }
                }
            }
            return channels;
        }

        function loadM3UFromUrl() {
            const url = document.getElementById('m3uUrlInput').value;
            if (!url) return;
            showStatus("جاري التحميل...");
            fetch(url).then(r => r.text()).then(data => {
                const channels = parseM3U(data);
                uploadChannelsToFirebase(channels);
            }).catch(() => alert("فشل تحميل الرابط، تأكد من الروابط التي تدعم CORS"));
        }

        function loadM3UFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const channels = parseM3U(e.target.result);
                uploadChannelsToFirebase(channels);
            };
            reader.readAsText(file);
        }

        function uploadChannelsToFirebase(channels) {
            if (channels.length === 0) return;
            showStatus("جاري الحفظ في القاعدة...");
            // نحدث المكتبة بالكامل
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.onload = function() { showStatus("تمت إضافة " + channels.length + " قناة ✅"); loadStream(); };
            xhr.send(JSON.stringify({ library: channels }));
        }

        function renderLibrary(channels) {
            const container = document.getElementById('channelsContainer');
            container.innerHTML = "";
            if (!channels || channels.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#555;'>لا توجد قنوات، ارفع ملف M3U</p>";
                return;
            }

            allChannels = channels;
            const groups = {};
            
            // تجميع القنوات
            channels.forEach(ch => {
                if (!groups[ch.group]) groups[ch.group] = [];
                groups[ch.group].push(ch);
            });

            Object.keys(groups).forEach(groupName => {
                const groupDiv = document.createElement('div');
                groupDiv.className = "group-container";
                
                const header = document.createElement('div');
                header.className = "group-header";
                header.innerHTML = `<span>${groupName}</span> <span>${groups[groupName].length} 📺</span>`;
                header.onclick = () => {
                    const content = groupDiv.querySelector('.group-content');
                    content.classList.toggle('show');
                };

                const content = document.createElement('div');
                content.className = "group-content";

                groups[groupName].forEach(ch => {
                    const item = document.createElement('div');
                    item.className = "channel-item";
                    item.innerText = ch.name;
                    item.onclick = (e) => {
                        e.stopPropagation();
                        selectChannel(ch);
                    };
                    content.appendChild(item);
                });

                groupDiv.appendChild(header);
                groupDiv.appendChild(content);
                container.appendChild(groupDiv);
            });
        }

        function selectChannel(ch) {
            if (isAdmin) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: ch.url, status: "playing", time: 0 }));
            }
            playMedia(ch.url);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function filterChannels() {
            const term = document.getElementById('searchBox').value.toLowerCase();
            const items = document.querySelectorAll('.channel-item');
            const groups = document.querySelectorAll('.group-container');

            items.forEach(item => {
                const isVisible = item.innerText.toLowerCase().includes(term);
                item.style.display = isVisible ? "block" : "none";
            });

            groups.forEach(group => {
                const hasVisible = group.querySelectorAll('.channel-item[style="display: block;"]').length > 0;
                group.style.display = hasVisible || term === "" ? "block" : "none";
                if (term !== "" && hasVisible) group.querySelector('.group-content').classList.add('show');
            });
        }

        function clearLibrary() {
            if(confirm("هل تريد مسح جميع القنوات؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ library: [] }));
            }
        }

        // --- الأكواد الأساسية (المزامنة) ---

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0; var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(k) {
                            if (now - data[k] < 10000) count++;
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    isSyncEnabled = data.syncEnabled !== false;
                    updateSyncButtonUI();
                    renderLibrary(data.library);
                    if (isSyncEnabled && !isAdmin) {
                        if (data.url !== lastUrl) playMedia(data.url);
                        if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                        if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                        else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
                    }
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                btn.innerText = isSyncEnabled ? "المزامنة: مفعلة ✅" : "المزامنة: معطلة ❌";
                btn.className = isSyncEnabled ? "btn-sync active" : "btn-sync inactive";
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg; status.style.display = "block";
            setTimeout(() => status.style.display = "none", 3000);
        }

        setInterval(() => {
            updatePresence();
            loadStream();
            if (isAdmin) {
                fetchViewerCount();
                if (isSyncEnabled) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime }));
                }
            }
        }, 5000);

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
