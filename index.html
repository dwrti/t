<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #050505; color: #fff;
            display: flex; flex-direction: column;
            align-items: center;    
            overflow-x: hidden; font-family: sans-serif;
        }

        .card { 
            background: #111; padding: 10px; border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; max-width: 650px; box-sizing: border-box;
            border: 1px solid #222; margin-top: 20px;
        }
        
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        .input-group { margin-bottom: 15px; background: #111; padding: 10px; border-radius: 10px; border: 1px solid #222; }
        
        input { 
            width: 100%; padding: 12px; margin: 5px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 14px; background: #1a1a1a; color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 5px; }

        button { 
            flex: 1; padding: 12px; background-color: #222; 
            color: #ccc; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 13px; transition: 0.3s;
        }

        .btn-add { background-color: #1e40af; color: white; border: none; width: 100%; margin-top: 5px; }
        .btn-sync.active { background-color: #2e7d32; color: #fff; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #c62828; color: #fff; border-color: #f44336; }
        .btn-delete { color: #ff4d4d; border-color: #442222; }

        /* ستايل المكتبة */
        #librarySection { 
            width: 95%; max-width: 650px; margin-top: 20px; padding-bottom: 40px;
            display: none; /* تظهر فقط عند إيقاف المزامنة */
        }
        .library-title { border-right: 4px solid #4caf50; padding-right: 10px; margin-bottom: 15px; font-size: 18px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .library-item { 
            background: #111; padding: 10px; border-radius: 8px; border: 1px solid #222;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .library-item span { font-size: 14px; margin-bottom: 8px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-btns { display: flex; gap: 5px; }
        .btn-play { background: #2e7d32; color: white; padding: 6px; font-size: 11px; }
        .btn-remove-item { background: #600; color: white; padding: 6px; font-size: 11px; flex: 0.4; }

        #statusText { text-align: center; font-size: 12px; color: #4caf50; margin-top: 5px; display: none; }
        h2, p, span.hide, h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="رابط سريع للبث المباشر..." onpaste="handlePaste(event)">
        
        <div class="input-group">
            <input type="text" id="libName" placeholder="اسم الحلقة أو الفيلم">
            <input type="text" id="libUrl" placeholder="رابط الفيديو">
            <button class="btn-add" onclick="addToLibrary()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="library-title">مكتبة الأفلام والمسلسلات</div>
        <div id="libraryGrid" class="grid">
            </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var baseUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (url === lastUrl) return;
            lastUrl = url;
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); return; }
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
        }

        // جلب البيانات الأساسية (المزامنة + الرابط الحالي)
        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", baseUrl + ".json", true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if (!data) return;
                    
                    isSyncEnabled = data.syncEnabled !== false; 
                    updateSyncUI();

                    if (isSyncEnabled) {
                        if (data.url !== lastUrl) playMedia(data.url);
                        if (Math.abs(videoElement.currentTime - data.time) > 3) {
                            videoElement.currentTime = data.time;
                        }
                        if (data.status === "playing" && videoElement.paused) {
                            videoElement.play().catch(e=>{});
                        } else if (data.status === "paused" && !videoElement.paused) {
                            videoElement.pause();
                        }
                        document.getElementById('librarySection').style.display = "none";
                    } else {
                        document.getElementById('librarySection').style.display = "block";
                        loadLibrary(); 
                    }
                }
            };
            xhr.send();
        }

        // جلب المكتبة
        function loadLibrary() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", baseUrl + "/library.json", true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var items = JSON.parse(xhr.responseText);
                    renderLibrary(items);
                }
            };
            xhr.send();
        }

        function renderLibrary(items) {
            var grid = document.getElementById('libraryGrid');
            grid.innerHTML = "";
            if (!items) return;
            Object.keys(items).forEach(function(key) {
                var item = items[key];
                var html = `
                    <div class="library-item">
                        <span>${item.name}</span>
                        <div class="item-btns">
                            <button class="btn-play" onclick="playMedia('${item.url}')">تشغيل ▶️</button>
                            ${isAdmin ? `<button class="btn-remove-item" onclick="removeFromLibrary('${key}')">🗑️</button>` : ''}
                        </div>
                    </div>
                `;
                grid.innerHTML += html;
            });
        }

        function addToLibrary() {
            var name = document.getElementById('libName').value;
            var url = document.getElementById('libUrl').value;
            if (!name || !url) return alert("املا الخانات");
            
            var xhr = new XMLHttpRequest();
            xhr.open("POST", baseUrl + "/library.json", true);
            xhr.send(JSON.stringify({ name: name, url: url }));
            document.getElementById('libName').value = "";
            document.getElementById('libUrl').value = "";
            showStatus("تمت الإضافة للمكتبة");
        }

        function removeFromLibrary(key) {
            if(!confirm("حذف من المكتبة؟")) return;
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", baseUrl + "/library/" + key + ".json", true);
            xhr.onload = function() { loadLibrary(); };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", baseUrl + ".json", true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncUI();
        }

        function updateSyncUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", baseUrl + ".json", true);
            xhr.send(JSON.stringify({
                status: videoElement.paused ? "paused" : "playing",
                time: videoElement.currentTime
            }));
        }

        setInterval(function() {
            loadStream();
            if (isAdmin && isSyncEnabled) updateDatabaseState();
        }, 3000);

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", baseUrl + ".json", true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث الرابط بنجاح ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف فيديو البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", baseUrl + ".json", true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 2000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
