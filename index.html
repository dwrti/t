<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* إعدادات الصفحة الأساسية */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .card { 
            position: -webkit-sticky; position: sticky; top: 0; z-index: 1000; 
            background: #000; width: 100%; max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; outline: none; }

        #contentWrapper { width: 100%; display: flex; flex-direction: column; align-items: center; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #c62828; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }
        
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        /* قسم المكتبة والمجلدات */
        #librarySection { width: 95%; max-width: 700px; margin: 20px auto 120px auto; display: none; }
        .ep-list { display: flex; flex-direction: column; align-items: center; }
        
        .folder-container { width: 100%; margin-bottom: 10px; border: 1px solid #222; border-radius: 10px; overflow: hidden; background: #050505; }
        .folder-header { padding: 15px; background: #111; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; color: #4a90e2; }
        .folder-content { display: none; padding: 5px; background: #000; }
        .folder-content.active { display: block; }

        .ep-item { 
            display: flex; align-items: center; 
            background: rgba(20,20,20,0.5); margin-bottom: 5px; 
            width: 100%; border-radius: 8px; border: 1px solid #111;
        }
        
        .ep-name-clickable { flex-grow: 1; padding: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: right; }
        .ep-name-text { color: #bbbbbb !important; font-size: 14px; display: block !important; }

        .lib-control-btn { background: transparent; border: none; height: 35px; font-size: 14px; cursor: pointer; padding: 0 10px; }
        .single-delete-btn { color: #883333; }
        .single-edit-btn { color: #338833; }

        .m3u-box { margin-top: 15px; padding: 15px; border: 1px dashed #333; border-radius: 10px; background: #050505; }
        .m3u-box label { display: block; margin-bottom: 8px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="contentWrapper">
        <div id="admin">
            <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>
            <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
            
            <div style="border-top: 1px solid #111; margin-top: 15px; padding-top: 10px;">
                <input type="text" id="epNameInput" placeholder="اسم العمل / الحلقة">
                <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
                <button style="background: #1a3a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
            </div>

            <div class="m3u-box">
                <label>رفع ملف M3U (سيتم تجميعها في مجلد القنوات):</label>
                <input type="file" id="m3uFile" accept=".m3u,.m3u8" style="padding: 5px; font-size: 12px;">
                <button style="background: #4a1a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="uploadM3U()">رفع ومعالجة الملف 📁</button>
            </div>

            <div class="btn-group" style="margin-top: 15px; border-top: 1px solid #111; padding-top: 10px;">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
            </div>
            <div id="statusText">تم التحديث بنجاح ✅</div>
        </div>

        <div id="librarySection">
            <div id="episodesContainer" class="ep-list"></div>
        </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);
        var currentLibraryHash = ""; // لمنع إعادة بناء القائمة إذا لم يتغير شيء

        function uploadM3U() {
            const fileInput = document.getElementById('m3uFile');
            const file = fileInput.files[0];
            if (!file) { alert("الرجاء اختيار ملف أولاً"); return; }

            showStatus("جاري تحليل القنوات... ⏳");
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                let channels = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF:')) {
                        let group = lines[i].match(/group-title="([^"]+)"/);
                        let name = lines[i].split(',').pop().trim();
                        let url = lines[i + 1] ? lines[i + 1].trim() : "";
                        if (url.startsWith('http')) {
                            channels.push({ 
                                name: name, 
                                url: url, 
                                group: group ? group[1] : "غير مصنف" 
                            });
                        }
                    }
                }
                if (channels.length > 0) {
                    if(confirm("وجدنا " + channels.length + " قناة. هل نبدأ الرفع؟")) pushChannelsSequentially(channels);
                }
            };
            reader.readAsText(file);
        }

        async function pushChannelsSequentially(channels) {
            for (let i = 0; i < channels.length; i++) {
                await new Promise(resolve => {
                    var xhr = new XMLHttpRequest();
                    xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
                    xhr.onload = () => resolve();
                    xhr.send(JSON.stringify(channels[i]));
                });
                if (i % 10 === 0) showStatus("تم رفع " + (i+1) + " قناة...");
            }
            showStatus("تم اكتمال الرفع بنجاح ✅");
            loadStream();
        }

        function renderLibrary(libData) {
            // كود ذكي لمقارنة البيانات الحالية بالسابقة لمنع الوميض أو الإغلاق التلقائي
            let newHash = JSON.stringify(libData);
            if (newHash === currentLibraryHash) return; 
            currentLibraryHash = newHash;

            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { container.innerHTML = "<div style='color:#444; padding:20px;'>المكتبة فارغة</div>"; return; }

            let normalItems = [];
            let m3uGroups = {};

            Object.keys(libData).forEach(key => {
                let item = libData[key];
                item.fbKey = key;
                if (item.group) {
                    if (!m3uGroups[item.group]) m3uGroups[item.group] = [];
                    m3uGroups[item.group].push(item);
                } else {
                    normalItems.push(item);
                }
            });

            // 1. عرض الملفات العادية
            normalItems.forEach(item => container.appendChild(createEpElement(item)));

            // 2. عرض مجلد M3U الرئيسي
            if (Object.keys(m3uGroups).length > 0) {
                let mainFolder = document.createElement('div');
                mainFolder.className = "folder-container";
                mainFolder.innerHTML = `<div class="folder-header" onclick="toggleFolder(this)">📂 [ M3U Playlists ] <span>▼</span></div>`;
                let mainContent = document.createElement('div');
                mainContent.className = "folder-content";

                for (let groupName in m3uGroups) {
                    let subFolder = document.createElement('div');
                    subFolder.className = "folder-container";
                    subFolder.style.margin = "5px";
                    subFolder.innerHTML = `<div class="folder-header" style="background:#1a1a1a; font-size:13px;" onclick="toggleFolder(this)">📁 ${groupName} <span>▼</span></div>`;
                    let subContent = document.createElement('div');
                    subContent.className = "folder-content";
                    
                    m3uGroups[groupName].forEach(ch => subContent.appendChild(createEpElement(ch)));
                    subFolder.appendChild(subContent);
                    mainContent.appendChild(subFolder);
                }
                mainFolder.appendChild(mainContent);
                container.appendChild(mainFolder);
            }
        }

        function createEpElement(ep) {
            var item = document.createElement('div');
            item.className = "ep-item";
            item.innerHTML = `
                ${isAdmin ? `<button class="lib-control-btn single-edit-btn" onclick="editSingleEpisode('${ep.fbKey}','${ep.name}','${ep.url}')">✏️</button>` : ''}
                <div class="ep-name-clickable" onclick="playSelected('${ep.url}', '${ep.name}')">
                    <span class="ep-name-text">${ep.name}</span>
                </div>
                ${isAdmin ? `<button class="lib-control-btn single-delete-btn" onclick="deleteSingleEpisode('${ep.fbKey}')">✕</button>` : ''}
            `;
            return item;
        }

        function toggleFolder(el) {
            let content = el.nextElementSibling;
            content.classList.toggle('active');
            el.querySelector('span').innerText = content.classList.contains('active') ? "▲" : "▼";
        }

        function playSelected(url, name) {
            if (isAdmin) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: url, status: "playing", time: 0 }));
            }
            playMedia(url);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // --- الدوال الأساسية المستقرة ---
        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0; var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: مفعلة ✅";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: معطلة ❌";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذا العنصر؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function editSingleEpisode(key, oldName, oldUrl) {
            var newName = prompt("تعديل الاسم:", oldName);
            if (newName === null) return;
            var newUrl = prompt("تعديل الرابط:", oldUrl);
            if (newUrl === null) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم التعديل ✅"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث البث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 4000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
