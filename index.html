<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin & Library</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #050505; color: #fff;
            display: flex; flex-direction: column;
            align-items: center; font-family: sans-serif;
            overflow-x: hidden;
        }

        /* حاوية الفيديو */
        .card { 
            background: #111; padding: 10px; border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; max-width: 650px; box-sizing: border-box;
            border: 1px solid #222; margin-top: 15px;
        }
        
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }

        /* لوحة التحكم */
        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; box-sizing: border-box;}
        
        input { 
            width: 100%; padding: 12px; margin: 5px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 14px; background: #1a1a1a; color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }

        button { 
            flex: 1; padding: 12px; background-color: #222; 
            color: #ccc; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 13px; transition: 0.3s;
            min-width: 120px;
        }

        .btn-sync.active { background-color: #2e7d32; color: #fff; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #c62828; color: #fff; border-color: #f44336; }
        .btn-add { background-color: #1565c0; color: white; border-color: #1e88e5; }
        .btn-delete { color: #ff4d4d; border-color: #442222; }

        /* مكتبة الحلقات */
        #library { 
            width: 95%; max-width: 650px; margin-top: 20px; 
            display: none; padding-bottom: 30px;
        }
        .library-title { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; font-size: 18px; }
        
        .episode-item {
            background: #161616; padding: 12px; border-radius: 8px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid #222;
        }
        .episode-info { cursor: pointer; flex-grow: 1; }
        .del-ep-btn { 
            background: #331111; color: #ff4d4d; border: 1px solid #552222;
            padding: 5px 10px; font-size: 11px; border-radius: 5px; width: auto; flex: none; margin-right: 10px;
        }

        #statusText { text-align: center; font-size: 12px; color: #4caf50; margin-top: 8px; display: none; }
        h2, p, span, h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي">
        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
        
        <input type="text" id="epName" placeholder="اسم الحلقة (مثال: الحلقة 1)">
        <input type="text" id="epUrl" placeholder="رابط الحلقة">
        <button class="btn-add" style="width: 100%;" onclick="addEpisode()">إضافة للمكتبة +</button>
        
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="library">
        <div class="library-title">📺 مكتبة الأفلام والمسلسلات</div>
        <div id="episodesList">
            </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (url === lastUrl || !url) return;
            lastUrl = url;
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
        }

        // --- وظائف المزامنة والقاعدة ---

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if(!data) return;
                    
                    isSyncEnabled = data.syncEnabled !== false;
                    updateUIState(data);
                    
                    if (isSyncEnabled) {
                        if (data.url !== lastUrl) playMedia(data.url);
                        if (Math.abs(videoElement.currentTime - data.time) > 3) {
                            videoElement.currentTime = data.time;
                        }
                        if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                        else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
                    }
                    
                    renderLibrary(data.library);
                }
            };
            xhr.send();
        }

        function updateUIState(data) {
            var btn = document.getElementById('syncToggleBtn');
            var lib = document.getElementById('library');
            
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
                lib.style.display = "none";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
                lib.style.display = "block";
            }
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
        }

        // --- إدارة المكتبة ---

        function addEpisode() {
            var name = document.getElementById('epName').value;
            var url = document.getElementById('epUrl').value;
            if(!name || !url) return alert("املا الخانات");

            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function() {
                var data = JSON.parse(xhr.responseText) || {};
                var lib = data.library || [];
                lib.push({ name: name, url: url, id: Date.now() });
                
                var patchXhr = new XMLHttpRequest();
                patchXhr.open("PATCH", dbUrl, true);
                patchXhr.send(JSON.stringify({ library: lib }));
                
                document.getElementById('epName').value = '';
                document.getElementById('epUrl').value = '';
                showStatus("تمت إضافة الحلقة ✅");
            };
            xhr.send();
        }

        function renderLibrary(lib) {
            var list = document.getElementById('episodesList');
            list.innerHTML = "";
            if(!lib) { list.innerHTML = "<p style='display:block !important; color:#666; text-align:center;'>المكتبة فارغة حالياً</p>"; return; }
            
            lib.forEach((ep, index) => {
                var div = document.createElement('div');
                div.className = "episode-item";
                div.innerHTML = `
                    <div class="episode-info" onclick="playMedia('${ep.url}')">
                        <b>${ep.name}</b>
                    </div>
                    ${isAdmin ? `<button class="del-ep-btn" onclick="deleteEpisode(${index})">حذف</button>` : ''}
                `;
                list.appendChild(div);
            });
        }

        function deleteEpisode(index) {
            if(!confirm("حذف هذه الحلقة؟")) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function() {
                var data = JSON.parse(xhr.responseText);
                data.library.splice(index, 1);
                var patchXhr = new XMLHttpRequest();
                patchXhr.open("PATCH", dbUrl, true);
                patchXhr.send(JSON.stringify({ library: data.library }));
            };
            xhr.send();
        }

        function deleteVideo() {
            if(confirm("حذف فيديو البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        // تحديث الرابط الأساسي عند الإدخال
        document.getElementById('urlInput').addEventListener('change', function() {
            var val = this.value.trim();
            if (val) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                showStatus("تم تحديث البث ✅");
            }
        });

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({
                status: videoElement.paused ? "paused" : "playing",
                time: videoElement.currentTime
            }));
        }

        setInterval(loadStream, 2000);
        if (isAdmin) {
            document.getElementById('admin').style.display = "block";
            ['play', 'pause', 'seeked'].forEach(ev => {
                videoElement.addEventListener(ev, () => { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg; status.style.display = "block";
            setTimeout(() => { status.style.display = "none"; }, 2000);
        }

        window.onload = loadStream;
    </script>
</body>
</html>
