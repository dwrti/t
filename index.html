<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي الكرتونية 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* ستايل عالم الكرتون */
        :root {
            --primary-color: #FFD700; /* أصفر كرتوني */
            --secondary-color: #FF5722; /* برتقالي حيوي */
            --bg-color: #4CC9F0; /* أزرق سماوي */
            --card-bg: #FFFFFF;
            --text-color: #2B2D42;
            --border-width: 4px;
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffffff 10%, transparent 10%);
            background-size: 30px 30px; /* خلفية منقطة كرتونية */
            color: var(--text-color);
            font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
            overflow-x: hidden;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }

        body { display: flex; flex-direction: column; align-items: center; }

        /* إطار المشغل الكرتوني */
        .card { 
            background: #000; 
            padding: 10px; 
            border-radius: 0 0 30px 30px; 
            width: 100%; max-width: 650px; box-sizing: border-box;
            border: var(--border-width) solid #000;
            border-top: none;
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
            z-index: 100;
            position: sticky; top: 0; 
            background-color: var(--primary-color);
        }
        
        video { 
            width: 100%; display: block; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 15px;
            border: 3px solid #000;
        }

        #admin { 
            display: none; width: 92%; max-width: 650px; 
            margin-top: 25px; background: #fff; 
            padding: 20px; border-radius: 20px;
            border: var(--border-width) solid #000;
            box-shadow: 8px 8px 0 #000;
        }
        
        #viewerCount {
            background: #FFEB3B;
            color: #000;
            padding: 10px;
            border-radius: 50px;
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
            border: 3px solid #000;
            font-weight: bold;
        }

        input { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 3px solid #000; border-radius: 12px; 
            font-size: 14px; background: #fff; color: #000;
            box-sizing: border-box; outline: none;
            font-weight: bold;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; 
            background-color: var(--secondary-color); 
            color: #fff; border: 3px solid #000; border-radius: 12px; 
            cursor: pointer; font-size: 14px; font-weight: 900;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 4px 4px 0 #000;
            text-transform: uppercase;
        }

        button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }

        .btn-sync.active { background-color: #4CAF50; }
        .btn-sync.inactive { background-color: #F44336; }
        .btn-delete { background-color: #FFC107; color: #000; }

        #statusText { 
            text-align: center; font-size: 14px; color: #D81B60; 
            margin: 10px 0; font-weight: bold; 
        }
        
        /* إخفاء العناصر غير المرغوبة */
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        #librarySection {
            width: 92%; max-width: 650px; 
            margin: 40px auto 100px auto; 
            background: #fff; border-radius: 25px; 
            border: var(--border-width) solid #000;
            padding: 20px; box-sizing: border-box; 
            display: none;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.1);
        }
        
        .lib-title { 
            font-size: 22px; margin-bottom: 20px; 
            color: #000; font-weight: 900; 
            text-align: center;
            border-bottom: 4px dashed var(--primary-color);
            padding-bottom: 10px;
        }

        .ep-list { overflow: visible; }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: #F8F9FA; margin-bottom: 12px; border-radius: 15px;
            border: 3px solid #000; overflow: hidden;
            flex-direction: row-reverse;
            transition: transform 0.2s;
            box-shadow: 4px 4px 0 #eee;
        }
        
        .ep-item:hover { transform: scale(1.02); background: #fff; }

        .ep-name-clickable {
            flex-grow: 1; padding: 18px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: right;
        }

        .ep-name-text { 
            color: #2B2D42 !important; 
            font-size: 17px; 
            display: block !important;
            font-weight: bold;
        }

        .lib-control-btn {
            background: #fff; border: none; 
            border-left: 3px solid #000;
            height: 55px; font-size: 20px; 
            cursor: pointer; display: none; 
            flex-shrink: 0; outline: none; padding: 0 15px;
        }
        
        .single-delete-btn { color: #f44336; }
        .single-edit-btn { color: #4caf50; }

        /* تحسينات الموبايل */
        @media (max-width: 480px) {
            .card { border-radius: 0; border-left: none; border-right: none; }
            #librarySection { width: 95%; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">عدد المتصلين الآن: 0</div>

        <input type="text" id="urlInput" placeholder="ضع رابط البث المباشر هنا..." onpaste="handlePaste(event)">
        
        <div style="border-top: 3px dashed #eee; margin-top: 15px; padding-top: 15px;">
            <input type="text" id="epNameInput" placeholder="اسم الحلقة (مثال: مغامرات عدنان)">
            <input type="text" id="epUrlInput" placeholder="رابط الحلقة المباشر...">
            <button style="background: #4CC9F0; color: white; width: 100%;" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="lib-title">📺 مكتبة الكرتون</div> 
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // الكود البرمجي (Javascript) يبقى كما هو لضمان عمل الواجهة مع Firebase
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "المشاهدون الآن: " + count + " 👀";
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#999;'>المكتبة فارغة حالياً.. أضف بعض المرح!</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("جاري عرض: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "lib-control-btn single-delete-btn";
                    delBtn.style.display = "block";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    
                    var editBtn = document.createElement('button');
                    editBtn.className = "lib-control-btn single-edit-btn";
                    editBtn.style.display = "block";
                    editBtn.innerHTML = "✏️";
                    editBtn.onclick = function(e) { e.stopPropagation(); editSingleEpisode(key, ep.name, ep.url); };

                    item.appendChild(delBtn);
                    item.appendChild(editBtn);
                }
                
                item.appendChild(nameBox);
                container.appendChild(item);
            });
        }

        function editSingleEpisode(key, oldName, oldUrl) {
            var newName = prompt("تعديل الاسم:", oldName);
            if (!newName) return;
            var newUrl = prompt("تعديل الرابط:", oldUrl);
            if (!newUrl) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم التحديث! ✨"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: تعمل ✅";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: متوقفة ❌";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل البيانات يا بطل!"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة بنجاح! 🎉");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث البث! 📺");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("هل تريد إيقاف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
