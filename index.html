<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي IPTV 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* إعدادات الصفحة الأساسية */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .card { 
            position: sticky; top: 0; z-index: 1000; 
            background: #000; width: 100%; max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; outline: none; }

        #contentWrapper { width: 100%; display: flex; flex-direction: column; align-items: center; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #c62828; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }
        
        /* تنسيق المجموعات والقنوات */
        .group-header {
            background: #1a1a1a; color: #ffd700; padding: 10px;
            width: 100%; text-align: right; font-weight: bold;
            margin-top: 15px; border-right: 4px solid #ffd700;
        }

        #librarySection { width: 95%; max-width: 700px; margin: 20px auto 120px auto; display: none; }
        .ep-list { display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: #080808; margin-bottom: 2px; 
            width: 100%; border-bottom: 1px solid #111;
        }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 12px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }

        .ep-name-text { color: #eee !important; font-size: 14px; display: block !important; text-align: right; }

    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="contentWrapper">
        <div id="admin">
            <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>
            
            <div style="background: #111; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                <label style="font-size: 12px; color: #888;">رفع ملف M3U من الهاتف:</label>
                <input type="file" id="m3uFile" accept=".m3u,.m3u8" style="background: transparent;">
                
                <label style="font-size: 12px; color: #888;">أو وضع رابط M3U مباشر:</label>
                <input type="text" id="m3uUrlInput" placeholder="ضع رابط ملف M3U هنا...">
                <button style="background: #1a3a8a; color: white; width: 100%; border: none;" onclick="loadM3UFromUrl()">تحميل القنوات ⬇️</button>
            </div>

            <div class="btn-group">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">إيقاف البث للجميع 🗑️</button>
            </div>
            <div id="statusText"></div>
        </div>

        <div id="librarySection">
            <div id="episodesContainer" class="ep-list"></div>
        </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        // --- وظائف M3U الجديدة ---

        // تحميل من ملف
        document.getElementById('m3uFile').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) { parseM3U(e.target.result); };
            reader.readAsText(file);
        });

        // تحميل من رابط
        function loadM3UFromUrl() {
            var url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return;
            showStatus("جاري جلب الملف...");
            fetch(url).then(res => res.text()).then(data => {
                parseM3U(data);
            }).catch(err => alert("فشل تحميل الرابط، تأكد من سياسة CORS أو الرابط"));
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            const channels = [];
            let currentGroup = "قنوات عامة";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    // استخراج المجموعة
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) currentGroup = groupMatch[1];
                    
                    // استخراج الاسم
                    const name = line.split(',').pop();
                    const url = lines[i + 1] ? lines[i + 1].trim() : "";
                    
                    if (url && !url.startsWith('#')) {
                        channels.push({ name, url, group: currentGroup });
                    }
                }
            }
            renderM3ULibrary(channels);
            showStatus("تم تحميل " + channels.length + " قناة");
        }

        function renderM3ULibrary(channels) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            
            // تجميع القنوات حسب المجموعة
            const groups = {};
            channels.forEach(ch => {
                if (!groups[ch.group]) groups[ch.group] = [];
                groups[ch.group].push(ch);
            });

            Object.keys(groups).forEach(groupName => {
                // رأس المجموعة
                var header = document.createElement('div');
                header.className = "group-header";
                header.innerText = groupName;
                container.appendChild(header);

                groups[groupName].forEach(ch => {
                    var item = document.createElement('div');
                    item.className = "ep-item";
                    item.innerHTML = `
                        <div class="ep-name-clickable">
                            <span class="ep-name-text">${ch.name}</span>
                        </div>
                    `;
                    item.onclick = function() {
                        if (isAdmin) {
                            updateRemoteStream(ch.url);
                        }
                        playMedia(ch.url);
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    };
                    container.appendChild(item);
                });
            });
        }

        function updateRemoteStream(url) {
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ url: url, status: "playing", time: 0 }));
        }

        // --- باقي وظائف النظام الأصلية (لم يتم تغيير منطقها) ---

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts') || url.includes('m3u'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            
            // المكتبة تظهر دائماً للأدمن لاختيار القنوات
            if (isAdmin) {
                document.getElementById('librarySection').style.display = "block";
            } else {
                // للمشاهد: إذا كان البث متوقف تظهر المكتبة (اختياري حسب رغبتك)
                document.getElementById('librarySection').style.display = isSyncEnabled ? "none" : "block";
            }

            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 5) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: مفعلة ✅";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: معطلة ❌";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        function deleteVideo() {
            if(confirm("إيقاف البث عن الجميع؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            setTimeout(function() { status.innerText = ""; }, 3000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                document.getElementById('librarySection').style.display = "block";
            }
        };
    </script>
</body>
</html>
