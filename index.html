<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* تحسينات السحب السلس ومنع التعليق */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }

        body {
            display: flex; flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .card { 
            background: #000; padding: 0; border-radius: 0; 
            width: 100%; max-width: 800px; box-sizing: border-box;
            border: none; z-index: 10;
            position: relative; margin: 0 auto;
        }
        
        video { 
            width: 100%; display: block; aspect-ratio: 16/9; background: #000; 
            border: none; outline: none; 
        }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: background 0.3s;
        }

        .btn-sync.active { background-color: #1b5e20; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #c62828; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }
        
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        #librarySection {
            width: 95%; max-width: 700px; 
            margin: 60px auto 100px auto;
            background: transparent; 
            padding: 10px; box-sizing: border-box; display: none;
        }
        
        /* تنسيق المجلدات القابلة للطي */
        .folder-toggle { 
            font-size: 15px; padding: 12px; background: #111; 
            color: #fff; border-radius: 8px; margin: 15px 0 5px 0;
            border-right: 4px solid #4caf50; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            user-select: none; transition: background 0.2s;
        }
        .folder-toggle:active { background: #1a1a1a; }
        .folder-toggle::after { content: '▼'; font-size: 10px; color: #666; }
        .folder-toggle.active::after { content: '▲'; }

        /* حاوية العناصر المخفية */
        .ep-list { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            overflow: hidden;
            border: 1px solid #111;
            border-top: none;
            border-radius: 0 0 8px 8px;
            background: rgba(255,255,255,0.01);
        }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: rgba(255,255,255,0.03); margin-bottom: 2px; 
            width: 100%;
            transition: opacity 0.2s;
        }
        
        .ep-item:active { opacity: 0.6; } 

        .ep-name-clickable {
            flex-grow: 1; padding: 12px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: right;
        }

        .ep-name-text { color: #bbbbbb !important; font-size: 15px; display: block !important; }

        .lib-control-btn {
            background: transparent; border: none; height: 40px; font-size: 16px; 
            cursor: pointer; display: none; padding: 0 10px;
        }
        
        .single-delete-btn { color: #883333; }
        .single-edit-btn { color: #338833; }

        .m3u-box {
            background: #0a0a0a; border: 1px dashed #333; border-radius: 8px;
            padding: 10px; margin-top: 15px;
        }
        .m3u-box h4 { margin: 0 0 10px 0; font-size: 14px; color: #888; text-align: center; display: block !important;}
        #fileInput { display: none; }
        .file-label {
            display: block; background: #222; color: #fff; padding: 10px;
            text-align: center; border-radius: 8px; cursor: pointer; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>

        <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
        
        <div style="border-top: 1px solid #111; margin-top: 15px; padding-top: 10px;">
            <input type="text" id="epNameInput" placeholder="اسم العمل / الحلقة">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
            <button style="background: #1a3a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>

        <div class="m3u-box">
            <h4>إضافة قائمة قنوات M3U (تلقائي للمجلد)</h4>
            <input type="text" id="m3uUrlInput" placeholder="ضع رابط M3U هنا...">
            <button style="background: #333; color: white; width: 100%; margin-bottom: 8px;" onclick="importM3UFromUrl()">استيراد من رابط</button>
            
            <label for="fileInput" class="file-label">📁 اختر ملف M3U من الهاتف</label>
            <input type="file" id="fileInput" accept=".m3u,.m3u8" onchange="importM3UFromFile(event)">
        </div>

        <div class="btn-group" style="margin-top: 15px; border-top: 1px solid #111; padding-top: 10px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="folder-toggle" onclick="toggleFolder('m3uEpisodesContainer', this)">📺 قنوات البث المباشر (M3U)</div>
        <div id="m3uEpisodesContainer" class="ep-list"></div>

        <div class="folder-toggle" onclick="toggleFolder('episodesContainer', this)">🎬 مقاطع الفيديو والحلقات</div>
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // دالة إخفاء وإظهار المجلد
        function toggleFolder(containerId, btn) {
            var container = document.getElementById(containerId);
            if (container.style.display === "flex") {
                container.style.display = "none";
                btn.classList.remove('active');
            } else {
                container.style.display = "flex";
                btn.classList.add('active');
            }
        }

        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        function parseM3U(data) {
            const lines = data.split('\n');
            let channels = [];
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF:')) {
                    let name = lines[i].split(',')[1] || "قناة غير معروفة";
                    let url = lines[i + 1] ? lines[i + 1].trim() : "";
                    if (url && url.startsWith('http')) {
                        channels.push({ name: name.trim(), url: url });
                    }
                }
            }
            return channels;
        }

        function uploadM3UToFirebase(channels) {
            if (channels.length === 0) { alert("لم يتم العثور على قنوات صالحة"); return; }
            if (!confirm("هل تريد إضافة " + channels.length + " قناة إلى مجلد M3U؟")) return;
            
            showStatus("جاري الرفع... يرجى الانتظار");
            let count = 0;
            channels.forEach(ch => {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/m3u_library.json", true);
                xhr.onload = function() {
                    count++;
                    if (count === channels.length) {
                        showStatus("تم استيراد القنوات بنجاح ✅");
                        loadStream();
                    }
                };
                xhr.send(JSON.stringify(ch));
            });
        }

        function importM3UFromUrl() {
            let url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return;
            showStatus("جاري جلب القائمة...");
            fetch(url).then(r => r.text()).then(data => {
                let channels = parseM3U(data);
                uploadM3UToFirebase(channels);
                document.getElementById('m3uUrlInput').value = "";
            }).catch(e => alert("خطأ في جلب الرابط. تأكد من أن الرابط يدعم CORS"));
        }

        function importM3UFromFile(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let channels = parseM3U(e.target.result);
                uploadM3UToFirebase(channels);
            };
            reader.readAsText(file);
        }

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts') || url.includes('m3u'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function createItemUI(key, ep, folderName) {
            var item = document.createElement('div');
            item.className = "ep-item";
            
            var nameBox = document.createElement('div');
            nameBox.className = "ep-name-clickable";
            nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
            nameBox.onclick = function() { 
                if (isAdmin) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                    showStatus("جاري تشغيل: " + ep.name);
                }
                playMedia(ep.url); 
                window.scrollTo({top: 0, behavior: 'smooth'}); 
            };

            if (isAdmin) {
                var delBtn = document.createElement('button');
                delBtn.className = "lib-control-btn single-delete-btn";
                delBtn.style.display = "block";
                delBtn.innerHTML = "✕";
                delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key, folderName); };
                
                var editBtn = document.createElement('button');
                editBtn.className = "lib-control-btn single-edit-btn";
                editBtn.style.display = "block";
                editBtn.innerHTML = "✏️";
                editBtn.onclick = function(e) { e.stopPropagation(); editSingleEpisode(key, ep.name, ep.url, folderName); };

                item.appendChild(editBtn);
                item.appendChild(nameBox);
                item.appendChild(delBtn);
            } else {
                item.appendChild(nameBox);
            }
            return item;
        }

        function renderLibrary(data) {
            var m3uContainer = document.getElementById('m3uEpisodesContainer');
            var normalContainer = document.getElementById('episodesContainer');
            
            m3uContainer.innerHTML = "";
            normalContainer.innerHTML = "";

            if (data.m3u_library) {
                Object.keys(data.m3u_library).forEach(function(key) {
                    m3uContainer.appendChild(createItemUI(key, data.m3u_library[key], "m3u_library"));
                });
            } else {
                m3uContainer.innerHTML = "<div style='color:#444; padding:10px; font-size:12px;'>لا توجد قنوات</div>";
            }

            if (data.library) {
                Object.keys(data.library).forEach(function(key) {
                    normalContainer.appendChild(createItemUI(key, data.library[key], "library"));
                });
            } else {
                normalContainer.innerHTML = "<div style='color:#444; padding:10px; font-size:12px;'>لا توجد فيديوهات</div>";
            }
        }

        function editSingleEpisode(key, oldName, oldUrl, folder) {
            var newName = prompt("تعديل الاسم:", oldName);
            if (newName === null) return;
            var newUrl = prompt("تعديل الرابط:", oldUrl);
            if (newUrl === null) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/"+folder+"/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم التعديل ✅"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function deleteSingleEpisode(key, folder) {
            if(confirm("حذف هذا العنصر؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/"+folder+"/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: مفعلة ✅";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: معطلة ❌";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل الاسم والرابط"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
