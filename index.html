<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* كلاسيكية بلون غامق وتوافق عالي */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #cccccc;
            font-family: Arial, sans-serif; /* خط كلاسيكي متوافق مع Puffin */
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body {
            display: flex; flex-direction: column;
            align-items: center;
        }

        /* المشغل بدون إطار */
        .card { 
            background: #000; padding: 0; border: none; 
            width: 100%; max-width: 800px;
            position: sticky; top: 0; z-index: 100;
        }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; border: none; outline: none; }

        /* منطقة الإدارة */
        #admin { display: none; width: 90%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            color: #4caf50; padding: 10px; text-align: center;
            font-size: 13px; border-bottom: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #333; background: #111; color: #fff;
            box-sizing: border-box; outline: none; border-radius: 4px;
        }

        button { 
            padding: 12px; background-color: #1a1a1a; 
            color: #fff; border: 1px solid #333; border-radius: 4px; 
            cursor: pointer; font-size: 14px;
        }

        /* المكتبة كلاسيكية بدون إطارات */
        #librarySection {
            width: 100%; max-width: 700px; 
            margin: 20px auto; 
            background: transparent;
            padding: 10px; box-sizing: border-box;
        }
        
        .ep-list { 
            display: flex; flex-direction: column;
        }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: transparent; 
            border-bottom: 1px solid #111; /* خط خفيف جدا للفصل كلاسيك */
            flex-direction: row-reverse;
        }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 18px 10px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: right;
        }

        .ep-name-text { 
            color: #bbbbbb !important; 
            font-size: 16px; 
            display: block !important;
            text-decoration: none;
        }

        /* أزرار التحكم في المكتبة (للمسؤول) */
        .lib-control-btn {
            background: transparent; border: none; 
            color: #555; padding: 0 15px; cursor: pointer;
        }

        .btn-sync.active { color: #4caf50; border-color: #4caf50; }
        .btn-sync.inactive { color: #f44336; border-color: #f44336; }
        
        h2, p, h3, .lib-title { display: none !important; }
        #statusText { text-align: center; font-size: 12px; color: #4caf50; height: 20px; }

    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">عدد المتصلين: --</div>
        <div id="statusText"></div>

        <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
        
        <div style="margin-top: 10px; padding: 10px; border: 1px solid #111;">
            <input type="text" id="epNameInput" placeholder="اسم المقطع">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو">
            <button style="width: 100%; background: #1a1a1a;" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>

        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <button id="syncToggleBtn" style="flex:1" onclick="toggleSync()">المزامنة</button>
            <button style="flex:1; color: #ff5252;" onclick="deleteVideo()">حذف البث</button>
        </div>
    </div>

    <div id="librarySection">
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // الكود البرمجي لم يتغير لضمان عمل كافة الوظائف السابقة
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.indexOf('m3u8') > -1 || url.indexOf('.ts') > -1)) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) return;
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "lib-control-btn";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    item.appendChild(delBtn);
                }
                
                item.appendChild(nameBox);
                container.appendChild(item);
            });
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }

            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) syncPlayer(JSON.parse(xhr.responseText));
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                btn.innerText = isSyncEnabled ? "المزامنة: مفعلة" : "المزامنة: معطلة";
                btn.className = isSyncEnabled ? "btn-sync active" : "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime }));
        }

        setInterval(function() {
            updatePresence();
            loadStream();
            if (isAdmin) fetchViewerCount();
        }, 5000);

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف الفيديو الحالي؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
