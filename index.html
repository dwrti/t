<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* نمط الكرتون الداكن */
        :root {
            --bg-color: #0d0d12;
            --card-bg: #1a1a24;
            --accent-color: #5d3fd3; /* بنفسجي كرتوني */
            --border-width: 4px;
            --cartoon-border: 4px solid #000;
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); color: #fff;
            font-family: 'Comic Sans MS', 'Arial', sans-serif; /* محاكاة لخط الكرتون */
            overflow-x: hidden;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; 
        }

        body {
            display: flex; flex-direction: column;
            align-items: center;
            background-image: radial-gradient(#1a1a24 20%, transparent 20%);
            background-size: 30px 30px; /* خلفية منقطة خفيفة للجو الكرتوني */
        }

        /* إطار المشغل الكرتوني */
        .card { 
            background: #000; 
            padding: 8px; 
            width: 95%; max-width: 650px; 
            box-sizing: border-box;
            border: var(--cartoon-border);
            border-radius: 20px;
            box-shadow: 8px 8px 0px #000; /* ظل حاد كرتوني */
            margin-top: 15px;
            position: sticky; top: 10px; 
            z-index: 100;
            overflow: hidden;
        }
        
        video { 
            width: 100%; 
            display: block; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 12px;
        }

        /* تنسيق الأدوات لمتصفح Puffin وغيره */
        #admin { 
            display: none; 
            width: 92%; max-width: 650px; 
            margin-top: 25px; 
            background: var(--card-bg);
            padding: 15px;
            border: var(--cartoon-border);
            border-radius: 15px;
            box-shadow: 5px 5px 0px #000;
        }
        
        #viewerCount {
            background: #2a2a3a;
            color: #00ffcc;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            margin-bottom: 12px;
            border: 2px solid #000;
            font-weight: bold;
        }

        input { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 3px solid #000; border-radius: 10px; 
            font-size: 14px; background: #252535; color: #fff;
            box-sizing: border-box; outline: none;
        }

        button { 
            flex: 1; min-width: 100px; padding: 12px; 
            background-color: #3b3b4f; 
            color: #fff; border: 3px solid #000; border-radius: 10px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }

        .btn-sync.active { background-color: #2ecc71; color: #000; }
        .btn-sync.inactive { background-color: #e74c3c; }
        .btn-delete { background-color: #95a5a6; color: #000; }

        #librarySection {
            width: 92%; max-width: 650px; 
            margin: 30px auto 100px auto; 
            background: var(--card-bg); 
            border-radius: 20px; 
            border: var(--cartoon-border);
            padding: 15px; box-sizing: border-box; display: none;
            box-shadow: 6px 6px 0px #000;
        }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: #2a2a3a; margin-bottom: 12px; border-radius: 12px;
            border: 3px solid #000; 
            flex-direction: row-reverse;
            transition: transform 0.1s;
            box-shadow: 4px 4px 0px #000;
        }
        
        .ep-name-text { 
            color: #fff !important; 
            font-size: 16px; 
            font-weight: bold;
            display: block !important;
        }

        /* إخفاء العناصر غير المطلوبة */
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }
        #statusText { color: #00ffcc; text-align: center; font-weight: bold; margin: 5px; }

        /* Puffin Fixes */
        .card, .ep-item, button { -webkit-box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>

        <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
        
        <div style="border-top: 3px solid #000; margin-top: 15px; padding-top: 10px;">
            <input type="text" id="epNameInput" placeholder="اسم العمل / الحلقة">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
            <button style="background: #5d3fd3; color: white; width: 100%; border: 3px solid #000; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group" style="display:flex; gap:8px; margin-top: 15px; border-top: 3px solid #000; padding-top: 10px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
        </div>
        <div id="statusText" style="display:none;">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // حافظت على كل السكربت الخاص بك كما هو لضمان عدم تعطل الوظائف البرمجية
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "المشاهدون الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#777; font-weight:bold;'>المكتبة فارغة حالياً 📺</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.style.flexGrow = "1";
                nameBox.style.padding = "15px";
                nameBox.style.cursor = "pointer";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("تشغيل: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.style.background = "transparent"; delBtn.style.border = "none"; delBtn.style.boxShadow = "none";
                    delBtn.style.color = "#ff4444"; delBtn.style.fontSize = "20px"; delBtn.style.cursor = "pointer";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    
                    var editBtn = document.createElement('button');
                    editBtn.style.background = "transparent"; editBtn.style.border = "none"; editBtn.style.boxShadow = "none";
                    editBtn.style.color = "#4caf50"; editBtn.style.fontSize = "18px";
                    editBtn.innerHTML = "✏️";
                    editBtn.onclick = function(e) { e.stopPropagation(); editSingleEpisode(key, ep.name, ep.url); };

                    item.appendChild(delBtn);
                    item.appendChild(editBtn);
                }
                
                item.appendChild(nameBox);
                container.appendChild(item);
            });
        }

        // ... (بقية الوظائف البرمجية مثل editSingleEpisode و deleteSingleEpisode وغيرها تبقى كما هي دون تغيير)
        function editSingleEpisode(key, oldName, oldUrl) {
            var newName = prompt("تعديل اسم المقطع:", oldName);
            if (newName === null) return;
            var newUrl = prompt("تعديل رابط المقطع:", oldUrl);
            if (newUrl === null) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم التعديل ✅"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: تعمل ✅";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: متوقفة ❌";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة ✅");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
