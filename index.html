<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* إعدادات الصفحة الأساسية */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body {
            display: flex; flex-direction: column;
            align-items: center;
        }

        /* تثبيت المشغل في الأعلى */
        .card { 
            position: -webkit-sticky; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: #000; 
            width: 100%; 
            max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { 
            width: 100%; 
            display: block; 
            aspect-ratio: 16/9; 
            background: #000; 
            outline: none; 
        }

        #contentWrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #c62828; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }
        
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        /* قسم المكتبة الجديد بنظام المجموعات */
        #librarySection {
            width: 95%; max-width: 700px; 
            margin: 20px auto 120px auto; 
            display: none;
        }
        
        .group-container {
            margin-bottom: 10px;
            border: 1px solid #222;
            border-radius: 10px;
            overflow: hidden;
            background: #0a0a0a;
        }

        .group-header {
            padding: 15px;
            background: #111;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #4caf50;
        }

        .group-content {
            display: none; /* مخفي افتراضياً */
            padding: 5px;
            background: #050505;
        }

        .group-content.open {
            display: block;
        }

        .ep-item { 
            display: flex; align-items: center; 
            background: rgba(30,30,30,0.3); margin-bottom: 4px; 
            width: 100%; border-radius: 6px; border: 1px solid #1a1a1a;
        }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 12px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: right;
        }

        .ep-name-text { color: #bbbbbb !important; font-size: 14px; display: block !important; }

        .lib-control-btn { background: transparent; border: none; height: 35px; font-size: 14px; cursor: pointer; padding: 0 10px; }
        .single-delete-btn { color: #883333; }

        .m3u-box {
            margin-top: 15px; padding: 15px; border: 1px dashed #333; border-radius: 10px; background: #050505;
        }
        .m3u-box label { display: block; margin-bottom: 8px; font-size: 13px; color: #888; }
        
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="contentWrapper">
        <div id="admin">
            <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>
            <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
            
            <div style="border-top: 1px solid #111; margin-top: 15px; padding-top: 10px;">
                <input type="text" id="epNameInput" placeholder="اسم القناة">
                <input type="text" id="epGroupInput" placeholder="اسم المجموعة (اختياري)">
                <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
                <button style="background: #1a3a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
            </div>

            <div class="m3u-box">
                <label>رفع ملف M3U (سيرتبها تلقائياً بمجلدات):</label>
                <input type="file" id="m3uFile" accept=".m3u,.m3u8" style="padding: 5px; font-size: 12px;">
                <button style="background: #4a1a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="uploadM3U()">رفع ومعالجة الملف 📁</button>
            </div>

            <div class="btn-group" style="margin-top: 15px; border-top: 1px solid #111; padding-top: 10px;">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
            </div>
            <div id="statusText">تم التحديث بنجاح ✅</div>
        </div>

        <div id="librarySection">
            <div id="episodesContainer"></div>
        </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);
        // متغير لحفظ المجلدات المفتوحة حتى لا تغلق عند التحديث
        var openedGroups = new Set();

        function uploadM3U() {
            const fileInput = document.getElementById('m3uFile');
            const file = fileInput.files[0];
            if (!file) { alert("الرجاء اختيار ملف أولاً"); return; }

            showStatus("جاري قراءة الملف... ⏳");
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                let channels = [];
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF:')) {
                        let groupMatch = lines[i].match(/group-title="([^"]+)"/);
                        let group = groupMatch ? groupMatch[1] : "عام";
                        let name = lines[i].split(',').pop().trim();
                        let url = lines[i + 1] ? lines[i + 1].trim() : "";
                        if (url && url.startsWith('http')) {
                            channels.push({ name: name, url: url, group: group });
                        }
                    }
                }
                if (channels.length > 0 && confirm("تم العثور على " + channels.length + " قناة. هل تريد الإضافة؟")) {
                    pushChannelsSequentially(channels);
                }
            };
            reader.readAsText(file);
        }

        async function pushChannelsSequentially(channels) {
            for (let i = 0; i < channels.length; i++) {
                await new Promise(res => {
                    var xhr = new XMLHttpRequest();
                    xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
                    xhr.onload = res;
                    xhr.send(JSON.stringify(channels[i]));
                });
                if (i % 10 === 0) showStatus("تم رفع " + i + " قناة...");
            }
            showStatus("اكتمل الرفع ✅");
            loadStream();
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { container.innerHTML = "<div style='text-align:center;color:#444;'>المكتبة فارغة</div>"; return; }
            
            // تجميع القنوات حسب المجلد
            let groups = {};
            Object.keys(libData).forEach(key => {
                let item = libData[key];
                item.dbKey = key;
                let gName = item.group || "عام";
                if (!groups[gName]) groups[gName] = [];
                groups[gName].push(item);
            });

            Object.keys(groups).forEach(groupName => {
                let groupDiv = document.createElement('div');
                groupDiv.className = "group-container";
                
                let header = document.createElement('div');
                header.className = "group-header";
                header.innerHTML = `<span>📁 ${groupName}</span> <span>${groups[groupName].length} قناة</span>`;
                
                let content = document.createElement('div');
                content.className = "group-content" + (openedGroups.has(groupName) ? " open" : "");
                
                header.onclick = () => {
                    content.classList.toggle('open');
                    content.classList.contains('open') ? openedGroups.add(groupName) : openedGroups.delete(groupName);
                };

                groups[groupName].forEach(ep => {
                    let epItem = document.createElement('div');
                    epItem.className = "ep-item";
                    epItem.innerHTML = `<div class="ep-name-clickable"><span class="ep-name-text">${ep.name}</span></div>`;
                    
                    if(isAdmin){
                        let del = document.createElement('button');
                        del.className = "lib-control-btn single-delete-btn";
                        del.innerHTML = "✕";
                        del.onclick = (e) => { e.stopPropagation(); deleteSingleEpisode(ep.dbKey); };
                        epItem.appendChild(del);
                    }

                    epItem.querySelector('.ep-name-clickable').onclick = () => {
                        if (isAdmin) {
                            var xhr = new XMLHttpRequest();
                            xhr.open("PATCH", dbUrl, true);
                            xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        }
                        playMedia(ep.url);
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    };
                    content.appendChild(epItem);
                });

                groupDiv.appendChild(header);
                groupDiv.appendChild(content);
                container.appendChild(groupDiv);
            });
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(e => {});
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    isSyncEnabled = data.syncEnabled !== false;
                    updateSyncButtonUI();
                    if (isAdmin || !isSyncEnabled) {
                        document.getElementById('librarySection').style.display = "block";
                        renderLibrary(data.library);
                    } else {
                        document.getElementById('librarySection').style.display = "none";
                    }
                    if (isSyncEnabled && !isAdmin) {
                        if (data.url !== lastUrl) playMedia(data.url);
                        if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                        data.status === "playing" ? videoElement.play().catch(e=>{}) : videoElement.pause();
                    }
                }
            };
            xhr.send();
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var group = document.getElementById('epGroupInput').value.trim() || "عام";
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = () => {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة ✅");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url, group: group }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف القناة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = () => loadStream();
                xhr.send();
            }
        }

        // --- الدوال المساعدة والأساسية ---
        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0; var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(k => {
                            if (now - data[k] < 10000) count++;
                            else if (now - data[k] > 60000) {
                                var del = new XMLHttpRequest();
                                del.open("DELETE", presenceUrl + "/" + k + ".json", true);
                                del.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (!btn) return;
            btn.innerText = isSyncEnabled ? "المزامنة: مفعلة ✅" : "المزامنة: معطلة ❌";
            btn.className = "btn-sync " + (isSyncEnabled ? "active" : "inactive");
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg; status.style.display = "block";
            setTimeout(() => { status.style.display = "none"; }, 4000);
        }

        function handlePaste(event) {
            setTimeout(() => {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = '';
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        setInterval(() => {
            updatePresence();
            loadStream();
            if (isAdmin) fetchViewerCount();
        }, 5000);

        window.onload = () => {
            loadStream(); updatePresence();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
