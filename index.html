<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #050505; color: #fff;
            display: flex; flex-direction: column; align-items: center;    
            font-family: sans-serif; overflow-x: hidden;
        }

        .card { 
            background: #111; padding: 10px; border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; max-width: 650px; box-sizing: border-box;
            border: 1px solid #222; margin-top: 20px;
        }
        
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        .input-group { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; margin-bottom: 10px; }
        
        input { 
            width: 100%; padding: 12px; margin: 5px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 14px; background: #1a1a1a; color: #fff;
            box-sizing: border-box; text-align: right; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }

        button { 
            flex: 1; padding: 12px; background-color: #222; 
            color: #ccc; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 13px; transition: 0.3s;
            min-width: 120px;
        }

        .btn-sync.active { background-color: #2e7d32; color: #fff; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #c62828; color: #fff; border-color: #f44336; }
        .btn-add { background-color: #1976d2; color: #fff; border-color: #2196f3; }
        .btn-delete { color: #ff4d4d; border-color: #442222; }

        /* ستايل المكتبة */
        #library { 
            width: 95%; max-width: 650px; margin-top: 20px; 
            display: none; padding-bottom: 40px;
        }
        .library-title { font-size: 18px; margin-bottom: 10px; border-right: 4px solid #1976d2; padding-right: 10px; }
        .episode-card {
            background: #161616; padding: 15px; border-radius: 10px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #222;
        }
        .episode-info { cursor: pointer; flex-grow: 1; }
        .del-ep { background: none; border: none; color: #ff4d4d; font-size: 18px; cursor: pointer; min-width: auto; padding: 0 10px; }

        #statusText { text-align: center; font-size: 12px; color: #4caf50; margin-top: 5px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="رابط البث المباشر الموحد...">
            <div class="btn-group">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="epTitle" placeholder="اسم الحلقة (مثال: الحلقة 1)">
            <input type="text" id="epUrl" placeholder="رابط فيديو الحلقة...">
            <div class="btn-group">
                <button class="btn-add" onclick="addEpisode()">إضافة للمكتبة +</button>
                <button class="btn-delete" onclick="clearLibrary()">تفريغ المكتبة ⚠️</button>
            </div>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="library">
        <div class="library-title">مكتبة الأفلام والمسلسلات</div>
        <div id="episodeList"></div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var epUrlDb = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url || url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(e => {});
        }

        function loadData() {
            fetch(dbUrl).then(r => r.json()).then(data => {
                if (!data) return;
                isSyncEnabled = data.syncEnabled !== false;
                updateUI();
                if (isSyncEnabled) {
                    if (data.url !== lastUrl) playMedia(data.url);
                    if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                    data.status === "playing" ? videoElement.play().catch(e => {}) : videoElement.pause();
                }
            });

            // تحميل المكتبة
            fetch(epUrlDb).then(r => r.json()).then(list => {
                const container = document.getElementById('episodeList');
                container.innerHTML = "";
                if (list) {
                    Object.keys(list).forEach(key => {
                        const ep = list[key];
                        container.innerHTML += `
                            <div class="episode-card">
                                <div class="episode-info" onclick="playMedia('${ep.url}')">
                                    <span>${ep.title}</span>
                                </div>
                                ${isAdmin ? `<button class="del-ep" onclick="deleteEpisode('${key}')">✕</button>` : ''}
                            </div>`;
                    });
                }
            });
        }

        function updateUI() {
            const btn = document.getElementById('syncToggleBtn');
            const lib = document.getElementById('library');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
                lib.style.display = "none";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
                lib.style.display = "block";
            }
        }

        // وظائف الأدمن
        function toggleSync() {
            isSyncEnabled = !isSyncEnabled;
            fetch(dbUrl, { method: 'PATCH', body: JSON.stringify({ syncEnabled: isSyncEnabled }) });
        }

        function addEpisode() {
            const title = document.getElementById('epTitle').value;
            const url = document.getElementById('epUrl').value;
            if (!title || !url) return alert("املأ البيانات");
            fetch(epUrlDb, { method: 'POST', body: JSON.stringify({ title, url }) })
            .then(() => {
                document.getElementById('epTitle').value = "";
                document.getElementById('epUrl').value = "";
                showStatus("تمت الإضافة");
            });
        }

        function deleteEpisode(key) {
            if (confirm("حذف هذه الحلقة؟")) {
                fetch(`https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library/${key}.json`, { method: 'DELETE' });
            }
        }

        function clearLibrary() {
            if (confirm("هل تريد مسح كل المكتبة؟")) {
                fetch(epUrlDb, { method: 'DELETE' });
            }
        }

        function deleteVideo() {
            fetch(dbUrl, { method: 'PATCH', body: JSON.stringify({ url: "", status: "paused", time: 0 }) });
        }

        // تحديث حالة البث (للأدمن فقط)
        setInterval(() => {
            if (isAdmin && isSyncEnabled) {
                fetch(dbUrl, { method: 'PATCH', body: JSON.stringify({
                    status: videoElement.paused ? "paused" : "playing",
                    time: videoElement.currentTime,
                    url: document.getElementById('urlInput').value || lastUrl
                })});
            }
            loadData();
        }, 3000);

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg; status.style.display = "block";
            setTimeout(() => status.style.display = "none", 2000);
        }

        window.onload = () => {
            if (isAdmin) document.getElementById('admin').style.display = "block";
            loadData();
        };
    </script>
</body>
</html>
