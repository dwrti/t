<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #050505; color: #fff;
            display: flex; flex-direction: column;
            align-items: center;    
            overflow-x: hidden; font-family: sans-serif;
            padding-top: 20px;
        }

        .card { 
            background: #111; padding: 10px; border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; max-width: 650px; box-sizing: border-box;
            border: 1px solid #222; margin-bottom: 10px;
        }
        
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        input { 
            width: 100%; padding: 12px; margin: 5px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 15px; background: #1a1a1a; color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }

        button { 
            flex: 1; padding: 12px; background-color: #222; 
            color: #ccc; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 14px; transition: 0.3s;
        }

        .btn-sync.active { background-color: #2e7d32; color: #fff; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #c62828; color: #fff; border-color: #f44336; }

        .btn-add { background-color: #1565c0; color: white; border-color: #1e88e5; }
        .btn-delete { color: #ff4d4d; border-color: #442222; }

        /* ستايل المكتبة */
        #librarySection { 
            width: 95%; max-width: 650px; margin-top: 20px; 
            display: none; padding-bottom: 40px;
        }
        .library-title { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; font-size: 18px; color: #aaa; }
        .movie-item {
            background: #161616; padding: 12px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; border: 1px solid #222;
        }
        .movie-info { cursor: pointer; flex-grow: 1; }
        .movie-name { font-weight: bold; color: #efefef; }
        .del-item { background: #331111; color: #ff5555; padding: 5px 10px; border-radius: 5px; font-size: 12px; border: none; flex: none; width: auto; }

        #statusText { text-align: center; font-size: 12px; color: #4caf50; margin-top: 5px; display: none; }
        h2, p, span, h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="ألصق رابط البث المباشر هنا..." onpaste="handlePaste(event)">
        
        <div style="margin-top: 15px; padding: 10px; border: 1px dashed #444; border-radius: 10px;">
            <input type="text" id="libTitle" placeholder="اسم الحلقة أو الفيلم">
            <input type="text" id="libUrl" placeholder="رابط الفيديو">
            <button class="btn-add" onclick="addToLibrary()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="library-title">🎬 مكتبة الأفلام والمسلسلات</div>
        <div id="libraryList"></div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var libUrlDb = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (url === lastUrl) return;
            lastUrl = url;
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); return; }
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();

            // إظهار أو إخفاء المكتبة بناءً على المزامنة
            document.getElementById('librarySection').style.display = isSyncEnabled ? "none" : "block";

            if (isSyncEnabled) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) {
                    videoElement.currentTime = data.time;
                }
                if (data.status === "playing" && videoElement.paused) {
                    videoElement.play().catch(function(e){});
                } else if (data.status === "paused" && !videoElement.paused) {
                    videoElement.pause();
                }
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        // --- وظائف المكتبة ---

        function loadLibrary() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", libUrlDb, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var items = JSON.parse(xhr.responseText);
                    renderLibrary(items);
                }
            };
            xhr.send();
        }

        function renderLibrary(items) {
            var list = document.getElementById('libraryList');
            list.innerHTML = "";
            if (!items) return;
            Object.keys(items).forEach(function(key) {
                var item = items[key];
                var div = document.createElement('div');
                div.className = 'movie-item';
                div.innerHTML = `
                    <div class="movie-info" onclick="playMedia('${item.url}')">
                        <div class="movie-name">${item.title}</div>
                    </div>
                    ${isAdmin ? `<button class="del-item" onclick="deleteFromLib('${key}')">حذف</button>` : ''}
                `;
                list.appendChild(div);
            });
        }

        function addToLibrary() {
            var title = document.getElementById('libTitle').value.trim();
            var url = document.getElementById('libUrl').value.trim();
            if (!title || !url) return alert("املا الخانات");
            
            var xhr = new XMLHttpRequest();
            xhr.open("POST", libUrlDb, true);
            xhr.send(JSON.stringify({ title: title, url: url }));
            document.getElementById('libTitle').value = "";
            document.getElementById('libUrl').value = "";
            showStatus("تمت الإضافة للمكتبة ✅");
            loadLibrary();
        }

        function deleteFromLib(id) {
            if(!confirm("حذف من المكتبة؟")) return;
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", `https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library/${id}.json`, true);
            xhr.onload = function() { loadLibrary(); };
            xhr.send();
        }

        // --- التحكم بالبث ---

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: متوقفة (المكتبة ظاهرة) ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = {
                status: videoElement.paused ? "paused" : "playing",
                time: videoElement.currentTime
            };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            loadStream();
            loadLibrary();
            if (isAdmin && isSyncEnabled) updateDatabaseState();
        }, 3000);

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث البث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف فيديو البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
                showStatus("تم الحذف 🗑️");
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 2000);
        }

        window.onload = function() {
            loadStream();
            loadLibrary();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
