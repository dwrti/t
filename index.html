<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #00d2ff;
            --danger-color: #ff4b2b;
            --bg-dark: #0f0c29;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); 
            color: #fff;
            display: flex; flex-direction: column;
            align-items: center;    
            overflow-x: hidden; font-family: 'Tajawal', sans-serif;
        }

        /* حاوية الفيديو */
        .card { 
            background: #000; padding: 5px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 92%; max-width: 650px; box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.1); margin-top: 20px;
            overflow: hidden;
        }
        
        video { width: 100%; border-radius: 10px; display: block; }

        /* منطقة التحكم (الأدمن) */
        #admin { 
            display: none; width: 92%; max-width: 650px; 
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box;
        }
        
        input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; 
            font-size: 14px; background: rgba(0,0,0,0.3); color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
            font-family: 'Tajawal'; transition: 0.3s;
        }
        input:focus { border-color: var(--accent-color); box-shadow: 0 0 10px rgba(0,210,255,0.3); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 120px; padding: 12px; 
            background: rgba(255,255,255,0.1); 
            color: #fff; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; cursor: pointer; font-size: 14px; 
            font-weight: bold; font-family: 'Tajawal'; transition: 0.3s;
        }

        .btn-add { background: var(--primary-gradient) !important; border: none !important; }
        .btn-sync.active { background: #2ecc71 !important; color: #fff; border: none; }
        .btn-sync.inactive { background: #e74c3c !important; color: #fff; border: none; }
        .btn-delete { background: rgba(231, 76, 60, 0.2); color: #ff6b6b; border: 1px solid #e74c3c; }

        /* ستايل المكتبة */
        #librarySection {
            width: 92%; max-width: 650px; margin: 20px 0 40px 0;
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; box-sizing: border-box; display: none;
        }
        
        .lib-title { 
            font-size: 20px; margin-bottom: 20px; 
            color: var(--accent-color); font-weight: bold;
            display: flex; align-items: center; gap: 10px;
        }
        .lib-title::before { content: '🎬'; }

        .ep-list { max-height: 450px; overflow-y: auto; padding-right: 5px; }
        
        .ep-item { 
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; background: rgba(255,255,255,0.05); 
            margin-bottom: 12px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05); padding: 5px 15px; 
            box-sizing: border-box; transition: 0.3s;
        }
        .ep-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        
        .ep-name-clickable {
            flex-grow: 1; display: flex; align-items: center; height: 55px;
            cursor: pointer; text-decoration: none;
        }

        .ep-name-text { 
            color: #fff !important; font-size: 15px; font-weight: 500;
            display: flex !important; align-items: center; gap: 10px;
        }
        .ep-name-text::before { content: '▶️'; font-size: 12px; opacity: 0.7; }

        .single-delete-btn {
            background: rgba(231, 76, 60, 0.2); color: #ff6b6b; 
            border: 1px solid rgba(231, 76, 60, 0.3);
            width: 35px; height: 35px; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer;
        }

        #statusText { 
            text-align: center; font-size: 13px; color: #2ecc71; 
            background: rgba(46, 204, 113, 0.1); padding: 8px;
            border-radius: 8px; margin-top: 10px; display: none; 
        }

        /* تخصيص السكرول بار */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        h2, p, span:not(.ep-name-text), h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
        
        <div style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 15px; padding-top: 15px;">
            <input type="text" id="epNameInput" placeholder="اسم الفيلم أو الحلقة">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
            <div class="btn-group">
                <button class="btn-add" onclick="addEpisode()">إضافة للمكتبة +</button>
            </div>
        </div>

        <div class="btn-group" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="lib-title">مكتبة المحتوى</div>
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // الكود البرمجي كما هو مع تعديلات بسيطة للتحسين الوظيفي
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:20px; color:rgba(255,255,255,0.4);'>المكتبة فارغة حالياً</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("جاري تشغيل: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                item.appendChild(nameBox);

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "single-delete-btn";
                    delBtn.innerHTML = "🗑️";
                    delBtn.onclick = function(e) { 
                        e.stopPropagation();
                        deleteSingleEpisode(key); 
                    };
                    item.appendChild(delBtn);
                }
                container.appendChild(item);
            });
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() {
                    showStatus("تم حذف الحلقة بنجاح");
                    loadStream();
                };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();

            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }

            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل الاسم والرابط"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            if (!isAdmin) loadStream();
            else { if (isSyncEnabled) updateDatabaseState(); loadStream(); }
        }, 2000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
