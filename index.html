<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --input-bg: #1e1e1e;
            --primary-gradient: linear-gradient(45deg, #007bff, #00d4ff);
            --success-gradient: linear-gradient(45deg, #28a745, #a2ffb1);
            --danger-gradient: linear-gradient(45deg, #dc3545, #ff7b7b);
            --warning-gradient: linear-gradient(45deg, #f39c12, #f1c40f);
            --accent-color: #bb86fc;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); color: #fff;
            display: flex; flex-direction: column;
            align-items: center;    
            overflow-x: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* حاوية الفيديو */
        .video-container { 
            width: 100%; max-width: 650px; 
            background: #000; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        video { width: 100%; aspect-ratio: 16/9; display: block; border-bottom: 2px solid #333; }

        /* البطاقات العامة */
        .card { 
            background: var(--card-bg); padding: 20px; border-radius: 15px; 
            width: 92%; max-width: 600px; box-sizing: border-box;
            border: 1px solid #222; margin-top: 15px;
        }

        #admin { display: none; width: 92%; max-width: 600px; }
        
        /* المدخلات */
        input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border: 1px solid #333; border-radius: 10px; 
            font-size: 14px; background: var(--input-bg); color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--accent-color); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        /* تصميم الأزرار الملونة */
        button { 
            flex: 1; min-width: 110px; padding: 14px; 
            color: #fff; border: none; border-radius: 10px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        button:active { transform: scale(0.95); opacity: 0.8; }

        .btn-add { background: var(--primary-gradient); width: 100% !important; margin-bottom: 10px; }
        .btn-sync.active { background: var(--success-gradient); color: #000; }
        .btn-sync.inactive { background: var(--warning-gradient); color: #000; }
        .btn-delete { background: var(--danger-gradient); }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }

        /* ستايل المكتبة */
        #librarySection {
            width: 92%; max-width: 600px; margin: 20px 0 40px 0;
            background: var(--card-bg); border-radius: 15px;
            padding: 15px; box-sizing: border-box; display: none;
        }
        
        .lib-title { 
            font-size: 18px; margin-bottom: 20px; 
            border-right: 5px solid #bb86fc; padding-right: 12px; 
            color: #fff; font-weight: bold; 
        }

        .ep-list { display: flex; flex-direction: column; gap: 12px; }
        
        .ep-item { 
            display: flex; align-items: center; justify-content: space-between;
            background: #1e1e1e; border-radius: 12px;
            border: 1px solid #333; overflow: hidden;
            transition: background 0.3s;
        }
        .ep-item:hover { background: #252525; }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 15px;
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }

        /* أيقونة تشغيل صغيرة */
        .ep-name-clickable::before {
            content: "▶"; font-size: 12px; color: var(--accent-color);
        }

        .ep-name-text { 
            color: #ffffff; font-size: 15px; font-weight: 500;
        }

        .single-delete-btn {
            background: rgba(220, 53, 69, 0.2); color: #ff4d4d; 
            border: none; width: 45px; height: 100%;
            padding: 15px; cursor: pointer; font-size: 18px;
        }

        /* شريط التمرير */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div class="card">
            <input type="text" id="urlInput" placeholder="رابط البث المباشر الموحد..." onpaste="handlePaste(event)">
            
            <div style="border-top: 1px solid #333; margin-top: 15px; padding-top: 10px;">
                <input type="text" id="epNameInput" placeholder="اسم الفيلم أو الحلقة">
                <input type="text" id="epUrlInput" placeholder="رابط المصدر مباشر...">
                <button class="btn-add" onclick="addEpisode()">إضافة للمكتبة +</button>
            </div>

            <div class="btn-group">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
            </div>
            <div id="statusText"></div>
        </div>
    </div>

    <div id="librarySection">
        <div class="lib-title">🎬 مكتبة المحتوى</div>
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // الكود البرمجي (JavaScript) يبقى كما هو لأنه يعمل بشكل صحيح 
        // سأقوم فقط بإعادة لصق الوظائف الأساسية لضمان عمل الواجهة الجديدة
        
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:20px; color:#666;'>المكتبة فارغة حالياً</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("تم البدء: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                item.appendChild(nameBox);

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "single-delete-btn";
                    delBtn.innerHTML = "×";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    item.appendChild(delBtn);
                }

                container.appendChild(item);
            });
        }

        // ... تتمة بقية الدوال السابقة (deleteSingleEpisode, syncPlayer, loadStream, toggleSync, etc.) ...
        // ملاحظة: قمت باختصار تكرار الدوال هنا للحفاظ على نظافة الرد، لكنها تعمل بنفس المنطق السابق.

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else { lib.style.display = "none"; }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل الاسم والرابط"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            if (!isAdmin) loadStream();
            else { if (isSyncEnabled) updateDatabaseState(); loadStream(); }
        }, 2000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
