<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --primary-blue: linear-gradient(135deg, #1e3a8a, #3b82f6);
            --primary-green: linear-gradient(135deg, #065f46, #10b981);
            --primary-red: linear-gradient(135deg, #7f1d1d, #ef4444);
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column;
            align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* حاوية الفيديو */
        .card { 
            background: #000; width: 100%; max-width: 650px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: sticky; top: 0; z-index: 100;
        }
        
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        /* منطقة التحكم للأدمن */
        #admin { 
            display: none; width: 92%; max-width: 650px; 
            margin-top: 15px; background: var(--card-bg);
            padding: 15px; border-radius: 15px; border: 1px solid #333;
        }
        
        input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border: 1px solid #333; border-radius: 10px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 14px; 
            border: none; border-radius: 10px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            color: white; transition: transform 0.1s, opacity 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        button:active { transform: scale(0.95); }

        .btn-add { background: var(--primary-blue); width: 100% !important; margin-top: 5px; }
        .btn-sync.active { background: var(--primary-green); }
        .btn-sync.inactive { background: #444; }
        .btn-delete { background: var(--primary-red); }

        #statusText { 
            text-align: center; font-size: 13px; color: #10b981; 
            margin-top: 10px; font-weight: bold; min-height: 18px;
        }

        /* ستايل المكتبة */
        #librarySection {
            width: 92%; max-width: 650px; margin: 20px 0 40px 0;
            background: var(--card-bg); border-radius: 15px;
            padding: 15px; box-sizing: border-box; display: none;
            border: 1px solid #222;
        }
        .lib-title { 
            font-size: 18px; margin-bottom: 15px; 
            color: #3b82f6; font-weight: bold;
            display: flex; align-items: center; gap: 8px;
        }
        .lib-title::before { content: ''; width: 4px; height: 18px; background: #3b82f6; border-radius: 2px; }

        .ep-list { max-height: 500px; overflow-y: auto; }
        
        /* تصميم كرت الحلقة */
        .ep-item { 
            display: flex; align-items: center; 
            background: #252525; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid #333; overflow: hidden;
            transition: background 0.3s;
        }
        .ep-item:hover { background: #2d2d2d; }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 15px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            display: flex; align-items: center; gap: 10px;
        }
        
        .play-icon {
            width: 30px; height: 30px; background: rgba(59, 130, 246, 0.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #3b82f6; font-size: 12px;
        }

        .ep-name-text { color: #fff; font-size: 15px; font-weight: 500; }

        .single-delete-btn {
            background: rgba(239, 68, 68, 0.1); color: #ef4444; 
            padding: 15px; font-size: 18px; border-right: 1px solid #333;
            cursor: pointer; display: none;
        }

        /* إخفاء العناصر غير الضرورية */
        h2, p, span:not(.ep-name-text):not(.play-icon), h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="رابط البث المباشر (لصق مباشر)" onpaste="handlePaste(event)">
        
        <div style="border-top: 1px solid #333; margin-top: 10px; padding-top: 10px;">
            <input type="text" id="epNameInput" placeholder="اسم الحلقة أو الفيلم">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر">
            <button class="btn-add" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group" style="margin-top: 15px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
        </div>
        <div id="statusText"></div>
    </div>

    <div id="librarySection">
        <div class="lib-title">مكتبة المحتوى</div>
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // الكود البرمجي كما هو مع تعديلات بسيطة في الـ HTML المتولد
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#666;'>المكتبة فارغة حالياً</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<div class="play-icon">▶</div><span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("تم البدء: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                item.appendChild(nameBox);

                if (isAdmin) {
                    var delBtn = document.createElement('div');
                    delBtn.className = "single-delete-btn";
                    delBtn.style.display = "flex";
                    delBtn.innerHTML = "🗑️";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    item.appendChild(delBtn);
                }

                container.appendChild(item);
            });
        }

        function deleteSingleEpisode(key) {
            if(confirm("هل تريد حذف هذا العنصر؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() {
                    showStatus("تم الحذف بنجاح");
                    loadStream();
                };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();

            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }

            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل البيانات كاملة"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة بنجاح");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            if (!isAdmin) loadStream();
            else { if (isSyncEnabled) updateDatabaseState(); loadStream(); }
        }, 2000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث البث المباشر");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("سيتم إيقاف البث للجميع، موافق؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            setTimeout(function() { status.innerText = ""; }, 3000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
