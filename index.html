<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل التزامن الذكي</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        video { width: 100%; max-width: 800px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .status { margin-top: 10px; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>

    <h2>متزامن الآن ⚡</h2>
    
    <video id="remoteVideo" controls>
        <source src="https://gofile.io/d/wuVuDk" type="video/mp4">
        متصفحك لا يدعم الفيديو.
    </video>

    <div class="status" id="status">جاري الاتصال بالسيرفر...</div>

    <script>
        // 1. إعدادات Firebase التي أرسلتها
        const firebaseConfig = {
            apiKey: "AIzaSyCDQm_qocYr7-QuAMIafyC6PuAzSbs8Q8k",
            authDomain: "axnt-68677.firebaseapp.com",
            databaseURL: "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "axnt-68677",
            storageBucket: "axnt-68677.firebasestorage.app",
            messagingSenderId: "838335964467",
            appId: "1:838335964467:web:5152329be098c9339a0a46"
        };

        // 2. تشغيل Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("sync_room_1");
        const video = document.getElementById("remoteVideo");
        const status = document.getElementById("status");
        let isReceiving = false; // لمنع الحلقة اللانهائية عند التحديث

        // 3. استقبال الأوامر من Firebase (من الطرف الآخر)
        db.on("value", (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            isReceiving = true;
            status.innerText = "متصل ومنضبط ✅";

            // تزامن الوقت (إذا كان الفرق أكثر من ثانية)
            if (Math.abs(video.currentTime - data.time) > 1) {
                video.currentTime = data.time;
            }

            // تزامن التشغيل والإيقاف
            if (data.playing && video.paused) video.play();
            else if (!data.playing && !video.paused) video.pause();

            setTimeout(() => { isReceiving = false; }, 100);
        });

        // 4. إرسال الأوامر عند التفاعل مع الفيديو
        const sendUpdate = () => {
            if (isReceiving) return; // لا ترسل إذا كنت أنت المستلم
            db.set({
                playing: !video.paused,
                time: video.currentTime,
                lastUpdated: Date.now()
            });
        };

        video.onplay = sendUpdate;
        video.onpause = sendUpdate;
        video.onseeked = sendUpdate; // عند تقديم الفيديو أو تأخيره

        // تحديث دوري خفيف لضمان دقة الوقت
        setInterval(() => {
            if (!video.paused && !isReceiving) {
                db.update({ time: video.currentTime });
            }
        }, 3000);

    </script>
</body>
</html>
