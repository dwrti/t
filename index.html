<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي TV 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .card { 
            position: sticky; top: 0; z-index: 1000; 
            background: #000; width: 100%; max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; outline: none; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; background: #0a0a0a; padding: 15px; border-radius: 12px; }
        
        #viewerCount { color: #4caf50; padding: 8px; text-align: center; font-size: 14px; margin-bottom: 10px; }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #111; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #1a1a1a; 
            color: #fff; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 14px;
        }

        .btn-sync.active { background-color: #1b5e20; }
        .btn-sync.inactive { background-color: #b71c1c; }

        /* تنسيق قائمة القنوات والمجموعات */
        #librarySection { width: 95%; max-width: 700px; margin: 20px auto 100px auto; }
        
        .group-header {
            background: #1a1a1a; padding: 12px; margin-top: 10px;
            border-radius: 8px; cursor: pointer; border-right: 4px solid #1a3a8a;
            display: flex; justify-content: space-between; align-items: center;
        }

        .channels-container { display: none; padding: 5px; background: #050505; }

        .ep-item { 
            display: flex; align-items: center; padding: 12px;
            border-bottom: 1px solid #111; cursor: pointer;
        }
        .ep-item:hover { background: #111; }
        .ep-name-text { font-size: 15px; color: #ccc; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; display: none; }
        
        .file-upload-label {
            display: block; background: #222; padding: 10px; text-align: center;
            border-radius: 8px; border: 1px dashed #444; margin: 10px 0; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">عدد المتصلين الآن: --</div>
        
        <div style="border-bottom: 1px solid #222; padding-bottom: 10px;">
            <label class="file-upload-label">
                رفع ملف M3U من الهاتف 📂
                <input type="file" id="m3uFile" accept=".m3u,.m3u8" style="display:none" onchange="handleFileUpload(event)">
            </label>
            <input type="text" id="m3uUrlInput" placeholder="أو ضع رابط M3U مباشر هنا...">
            <button style="background: #1a3a8a; color: white; width: 100%; border: none;" onclick="loadM3uFromUrl()">تحميل الرابط 🔗</button>
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button style="color: #ff5252;" onclick="deleteLibrary()">مسح القائمة 🗑️</button>
        </div>
        <div id="statusText">تم التحديث ✅</div>
    </div>

    <div id="librarySection">
        <div id="episodesContainer"></div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        // --- وظائف M3U ---

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    const nameMatch = line.split(',')[1];
                    currentChannel.group = groupMatch ? groupMatch[1] : "قنوات متنوعة";
                    currentChannel.name = nameMatch ? nameMatch.trim() : "قناة غير معروفة";
                } else if (line.startsWith('http')) {
                    currentChannel.url = line;
                    channels.push({ ...currentChannel });
                    currentChannel = {};
                }
            }
            return channels;
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const channels = parseM3U(e.target.result);
                uploadChannelsToFirebase(channels);
            };
            reader.readAsText(file);
        }

        function loadM3uFromUrl() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return;
            showStatus("جاري جلب الملف...");
            fetch(url).then(r => r.text()).then(data => {
                const channels = parseM3U(data);
                uploadChannelsToFirebase(channels);
            }).catch(() => alert("فشل تحميل الرابط، تأكد من أن الرابط مباشر ويدعم CORS"));
        }

        function uploadChannelsToFirebase(channels) {
            if (!channels.length) return;
            showStatus("جاري الرفع...");
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.onload = function() { showStatus("تم رفع " + channels.length + " قناة ✅"); loadStream(); };
            xhr.send(JSON.stringify({ library: channels }));
        }

        function renderLibrary(channels) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!channels) { container.innerHTML = "<div style='text-align:center; padding:50px; color:#555;'>لا توجد قنوات، ارفع ملف M3U</div>"; return; }

            // تجميع القنوات حسب المجموعات
            const groups = {};
            channels.forEach(ch => {
                if (!groups[ch.group]) groups[ch.group] = [];
                groups[ch.group].push(ch);
            });

            Object.keys(groups).forEach(groupName => {
                const groupDiv = document.createElement('div');
                groupDiv.innerHTML = `<div class="group-header" onclick="toggleGroup(this)">
                    <span>${groupName}</span>
                    <small>${groups[groupName].length} قناة</small>
                </div>`;
                
                const channelList = document.createElement('div');
                channelList.className = "channels-container";

                groups[groupName].forEach(ch => {
                    const item = document.createElement('div');
                    item.className = "ep-item";
                    item.innerHTML = `<span class="ep-name-text">${ch.name}</span>`;
                    item.onclick = function() {
                        if (isAdmin) {
                            var xhr = new XMLHttpRequest();
                            xhr.open("PATCH", dbUrl, true);
                            xhr.send(JSON.stringify({ url: ch.url, status: "playing", time: 0 }));
                        }
                        playMedia(ch.url);
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    };
                    channelList.appendChild(item);
                });

                groupDiv.appendChild(channelList);
                container.appendChild(groupDiv);
            });
        }

        function toggleGroup(el) {
            const container = el.nextElementSibling;
            container.style.display = container.style.display === "block" ? "none" : "block";
        }

        function deleteLibrary() {
            if(confirm("هل تريد مسح جميع القنوات؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ library: null }));
            }
        }

        // --- الأكواد الأساسية (بدون تغيير) ---

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if (!data) return;
                    isSyncEnabled = data.syncEnabled !== false;
                    updateSyncButtonUI();
                    renderLibrary(data.library);
                    
                    if (isSyncEnabled && !isAdmin) {
                        if (data.url !== lastUrl) playMedia(data.url);
                        if (Math.abs(videoElement.currentTime - data.time) > 4) videoElement.currentTime = data.time;
                        if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                        else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
                    }
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                btn.innerText = isSyncEnabled ? "المزامنة: مفعلة ✅" : "المزامنة: معطلة ❌";
                btn.className = isSyncEnabled ? "btn-sync active" : "btn-sync inactive";
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg; status.style.display = "block";
            setTimeout(() => status.style.display = "none", 3000);
        }

        setInterval(function() {
            updatePresence();
            loadStream();
        }, 5000);

        window.onload = function() {
            if(isAdmin) document.getElementById('admin').style.display = "block";
            loadStream();
        };
    </script>
</body>
</html>
