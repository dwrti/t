<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* إعدادات الصفحة الأساسية */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .card { 
            position: sticky; top: 0; z-index: 1000; 
            background: #000; width: 100%; max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; outline: none; }

        #contentWrapper { width: 100%; display: flex; flex-direction: column; align-items: center; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #c62828; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }
        
        /* قسم المكتبة والقنوات */
        #librarySection, #m3uSection {
            width: 95%; max-width: 700px; margin: 20px auto; display: none;
        }
        
        .group-header {
            background: #111; padding: 12px; margin-top: 5px;
            border-radius: 5px; cursor: pointer; border-right: 4px solid #1a3a8a;
            font-weight: bold; display: flex; justify-content: space-between;
        }

        .channels-container { display: none; padding: 5px; background: #050505; }

        .ep-list { display: flex; flex-direction: column; align-items: center; }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: #0a0a0a; margin-bottom: 2px; 
            width: 100%; border: none; border-bottom: 1px solid #111;
        }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 12px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }

        .ep-name-text { color: #bbbbbb !important; font-size: 14px; display: block !important; }

        .lib-control-btn { background: transparent; border: none; height: 40px; font-size: 16px; cursor: pointer; padding: 0 10px; }
        .single-delete-btn { color: #883333; }
        
        #m3uControls { background: #0a0a0a; padding: 15px; border-radius: 10px; border: 1px solid #1a1a1a; margin-bottom: 15px;}

    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="contentWrapper">
        <div id="admin">
            <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>
            <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
            
            <div id="m3uControls">
                <label style="font-size: 12px; color: #888;">إضافة قائمة M3U (ملف أو رابط):</label>
                <input type="text" id="m3uUrlInput" placeholder="رابط ملف m3u...">
                <input type="file" id="m3uFileInput" accept=".m3u,.m3u8" style="display: none;">
                <div class="btn-group">
                    <button onclick="loadM3UFromUrl()" style="background: #0d47a1;">تحميل الرابط</button>
                    <button onclick="document.getElementById('m3uFileInput').click()" style="background: #37474f;">رفع ملف</button>
                </div>
            </div>

            <div style="border-top: 1px solid #111; margin-top: 15px; padding-top: 10px;">
                <input type="text" id="epNameInput" placeholder="اسم العمل / الحلقة">
                <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
                <button style="background: #1a3a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
            </div>

            <div class="btn-group" style="margin-top: 15px; border-top: 1px solid #111; padding-top: 10px;">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
                <button onclick="clearM3U()" style="background: #333; font-size: 11px;">مسح قائمة M3U</button>
            </div>
            <div id="statusText">تم التحديث بنجاح ✅</div>
        </div>

        <div id="m3uSection">
            <div style="color: #4caf50; font-size: 14px; margin-bottom: 10px;">قنوات M3U المضافة:</div>
            <div id="m3uGroupsContainer"></div>
        </div>

        <div id="librarySection">
            <div id="episodesContainer" class="ep-list"></div>
        </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        // --- وظائف M3U ---
        function parseM3U(data) {
            const lines = data.split('\n');
            const groups = {};
            let currentGroup = "قنوات عامة";
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    // محاولة استخراج المجموعة
                    let groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) {
                        currentGroup = groupMatch[1];
                    } else {
                        // محاولة البحث عن وسم EXTGRP في السطر التالي
                        if (lines[i+1] && lines[i+1].startsWith('#EXTGRP:')) {
                            currentGroup = lines[i+1].replace('#EXTGRP:', '').trim();
                        }
                    }
                    
                    let name = line.split(',').pop();
                    let url = lines[i + (lines[i+1].startsWith('#EXTGRP:') ? 2 : 1)]?.trim();
                    
                    if (url && url.startsWith('http')) {
                        if (!groups[currentGroup]) groups[currentGroup] = [];
                        groups[currentGroup].push({ name, url });
                    }
                }
            }
            return groups;
        }

        function displayM3U(groups) {
            const container = document.getElementById('m3uGroupsContainer');
            container.innerHTML = "";
            document.getElementById('m3uSection').style.display = "block";

            Object.keys(groups).forEach(groupName => {
                const header = document.createElement('div');
                header.className = "group-header";
                header.innerHTML = `<span>📂 ${groupName}</span> <span>${groups[groupName].length} قناة</span>`;
                
                const channelsDiv = document.createElement('div');
                channelsDiv.className = "channels-container";
                
                groups[groupName].forEach(ch => {
                    const item = document.createElement('div');
                    item.className = "ep-item";
                    item.innerHTML = `<div class="ep-name-clickable"><span class="ep-name-text">${ch.name}</span></div>`;
                    item.onclick = () => {
                        updateMainStream(ch.url, ch.name);
                    };
                    channelsDiv.appendChild(item);
                });

                header.onclick = () => {
                    const isVisible = channelsDiv.style.display === "block";
                    channelsDiv.style.display = isVisible ? "none" : "block";
                };

                container.appendChild(header);
                container.appendChild(channelsDiv);
            });
        }

        function loadM3UFromUrl() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return;
            showStatus("جاري تحميل القائمة...");
            fetch(url).then(r => r.text()).then(data => {
                const groups = parseM3U(data);
                localStorage.setItem('savedM3U', JSON.stringify(groups));
                displayM3U(groups);
                showStatus("تم التحميل بنجاح ✅");
            }).catch(e => showStatus("خطأ في التحميل (تأكد من الرابط)"));
        }

        document.getElementById('m3uFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const groups = parseM3U(e.target.result);
                localStorage.setItem('savedM3U', JSON.stringify(groups));
                displayM3U(groups);
                showStatus("تم رفع الملف ✅");
            };
            reader.readAsText(file);
        });

        function clearM3U() {
            if(confirm("مسح القائمة المحفوظة؟")) {
                localStorage.removeItem('savedM3U');
                document.getElementById('m3uGroupsContainer').innerHTML = "";
                showStatus("تم المسح");
            }
        }

        function updateMainStream(url, name) {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ url: url, status: "playing", time: 0 }));
            showStatus("تشغيل: " + name);
            playMedia(url);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // --- بقية الأكواد الأصلية مع الحفاظ عليها ---

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0; var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) return;
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                item.innerHTML = `<div class="ep-name-clickable"><span class="ep-name-text">${ep.name}</span></div>`;
                item.onclick = function() { updateMainStream(ep.url, ep.name); };
                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "lib-control-btn single-delete-btn";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    item.appendChild(delBtn);
                }
                container.appendChild(item);
            });
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                btn.innerText = isSyncEnabled ? "المزامنة: مفعلة ✅" : "المزامنة: معطلة ❌";
                btn.className = isSyncEnabled ? "btn-sync active" : "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            loadStream();
            if (isAdmin) fetchViewerCount();
        }, 5000);

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    updateMainStream(val, "بث جديد");
                    document.getElementById('urlInput').value = ''; 
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
                // استعادة القائمة المحفوظة إن وجدت
                const saved = localStorage.getItem('savedM3U');
                if (saved) displayM3U(JSON.parse(saved));
            }
        };
    </script>
</body>
</html>
