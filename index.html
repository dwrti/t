<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* إعدادات الصفحة الأساسية */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .card { 
            position: -webkit-sticky; position: sticky; 
            top: 0; z-index: 1000; background: #000; 
            width: 100%; max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; outline: none; }

        #contentWrapper { width: 100%; display: flex; flex-direction: column; align-items: center; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #c62828; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }
        
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        /* قسم المكتبة والقنوات */
        #librarySection, #m3uSection {
            width: 95%; max-width: 700px; 
            margin: 20px auto 20px auto; 
            display: none;
        }
        
        .lib-title { font-size: 17px; margin-bottom: 15px; text-align: center; color: #777; border-bottom: 1px solid #222; padding-bottom: 10px; }

        .ep-list { display: flex; flex-direction: column; align-items: center; }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: #0a0a0a; margin-bottom: 8px; 
            width: 100%; border: 1px solid #1a1a1a; border-radius: 8px;
        }

        .folder-item { background: #1a1a1a; border-left: 4px solid #1a3a8a; }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 15px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: right;
        }

        .ep-name-text { color: #bbbbbb !important; font-size: 15px; display: block !important; }

        .lib-control-btn { background: transparent; border: none; height: 40px; font-size: 16px; cursor: pointer; padding: 0 10px; }
        .single-delete-btn { color: #883333; }
        .single-edit-btn { color: #338833; }

        /* تنسيق خاص لقسم M3U */
        .m3u-box { background: #0a0a0a; border: 1px dashed #333; padding: 15px; border-radius: 10px; margin-top: 15px; }
        
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="contentWrapper">
        <div id="admin">
            <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>
            <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
            
            <div class="m3u-box">
                <div style="font-size: 12px; color: #666; margin-bottom: 5px;">إضافة قائمة قنوات M3U:</div>
                <input type="text" id="m3uUrlInput" placeholder="رابط ملف m3u...">
                <input type="file" id="m3uFileInput" accept=".m3u,.m3u8" style="font-size: 11px; background: transparent; border: none;">
                <button style="background: #2e7d32; color: white; width: 100%; border: none; margin-top: 5px;" onclick="processM3U()">تحميل القنوات وتصنيفها 📁</button>
            </div>

            <div style="border-top: 1px solid #111; margin-top: 15px; padding-top: 10px;">
                <input type="text" id="epNameInput" placeholder="اسم العمل / الحلقة">
                <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
                <button style="background: #1a3a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
            </div>

            <div class="btn-group" style="margin-top: 15px; border-top: 1px solid #111; padding-top: 10px;">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
                <button class="btn-delete" style="background: #441111;" onclick="clearM3U()">مسح قنوات M3U ⚠️</button>
            </div>
            <div id="statusText">تم التحديث بنجاح ✅</div>
        </div>

        <div id="m3uSection">
            <div class="lib-title" id="m3uTitle">قنوات M3U</div>
            <div id="m3uContainer" class="ep-list"></div>
        </div>

        <div id="librarySection">
            <div class="lib-title">المكتبة الخاصة</div> 
            <div id="episodesContainer" class="ep-list"></div>
        </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);
        
        // متغيرات لملف M3U
        var m3uData = {}; 
        var currentFolder = null;

        // --- دوال M3U الجديدة ---

        function processM3U() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            const fileInput = document.getElementById('m3uFileInput');
            
            if (url) {
                fetch(url).then(r => r.text()).then(text => parseM3U(text));
            } else if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = (e) => parseM3U(e.target.result);
                reader.readAsText(fileInput.files[0]);
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            const groups = {};
            let currentGroup = "قنوات عامة";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) currentGroup = groupMatch[1];
                    
                    const name = line.split(',').pop();
                    const nextLine = lines[i+1] ? lines[i+1].trim() : "";
                    
                    if (nextLine && !nextLine.startsWith('#')) {
                        if (!groups[currentGroup]) groups[currentGroup] = [];
                        groups[currentGroup].push({ name: name, url: nextLine });
                    }
                }
            }
            
            // حفظ في Firebase
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.onload = () => { showStatus("تم رفع القنوات بنجاح ✅"); loadStream(); };
            xhr.send(JSON.stringify({ m3u_channels: groups }));
        }

        function renderM3U(groups) {
            const container = document.getElementById('m3uContainer');
            container.innerHTML = "";
            if (!groups) return;

            if (currentFolder) {
                // عرض القنوات داخل المجلد
                const backBtn = document.createElement('div');
                backBtn.className = "ep-item folder-item";
                backBtn.innerHTML = `<div class="ep-name-clickable"><span class="ep-name-text">🔙 العودة للمجلدات الرئيسية (قائمة: ${currentFolder})</span></div>`;
                backBtn.onclick = () => { currentFolder = null; renderM3U(groups); };
                container.appendChild(backBtn);

                groups[currentFolder].forEach(ch => {
                    const item = document.createElement('div');
                    item.className = "ep-item";
                    item.innerHTML = `<div class="ep-name-clickable"><span class="ep-name-text">📺 ${ch.name}</span></div>`;
                    item.onclick = () => {
                        if (isAdmin) {
                            var xhr = new XMLHttpRequest();
                            xhr.open("PATCH", dbUrl, true);
                            xhr.send(JSON.stringify({ url: ch.url, status: "playing", time: 0 }));
                        }
                        playMedia(ch.url);
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    };
                    container.appendChild(item);
                });
            } else {
                // عرض المجلدات (المجموعات)
                Object.keys(groups).forEach(groupName => {
                    const item = document.createElement('div');
                    item.className = "ep-item folder-item";
                    item.innerHTML = `<div class="ep-name-clickable"><span class="ep-name-text">📁 ${groupName} (${groups[groupName].length} قناة)</span></div>`;
                    item.onclick = () => { currentFolder = groupName; renderM3U(groups); };
                    container.appendChild(item);
                });
            }
        }

        function clearM3U() {
            if(confirm("هل تريد مسح جميع قنوات M3U المرفوعة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/m3u_channels.json", true);
                xhr.onload = () => loadStream();
                xhr.send();
            }
        }

        // --- الدوال الأساسية (المعدلة لدعم القسم الجديد) ---

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:15px; color:#444;'>المكتبة فارغة</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "lib-control-btn single-delete-btn";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    
                    var editBtn = document.createElement('button');
                    editBtn.className = "lib-control-btn single-edit-btn";
                    editBtn.innerHTML = "✏️";
                    editBtn.onclick = function(e) { e.stopPropagation(); editSingleEpisode(key, ep.name, ep.url); };

                    item.appendChild(editBtn);
                    item.appendChild(nameBox);
                    item.appendChild(delBtn);
                } else {
                    item.appendChild(nameBox);
                }
                container.appendChild(item);
            });
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            
            // تحديث الأقسام
            var lib = document.getElementById('librarySection');
            var m3uSec = document.getElementById('m3uSection');
            
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                m3uSec.style.display = "block";
                renderLibrary(data.library);
                renderM3U(data.m3u_channels);
            } else {
                lib.style.display = "none";
                m3uSec.style.display = "none";
            }

            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 4) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        // --- باقي الدوال القديمة كما هي ---

        function editSingleEpisode(key, oldName, oldUrl) {
            var newName = prompt("تعديل اسم المقطع:", oldName);
            if (!newName) return;
            var newUrl = prompt("تعديل رابط المقطع:", oldUrl);
            if (!newUrl) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم التعديل ✅"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: مفعلة ✅";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: معطلة ❌";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
