<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* إعدادات الصفحة الأساسية */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body {
            display: flex; flex-direction: column;
            align-items: center;
        }

        /* تثبيت المشغل في الأعلى */
        .card { 
            position: -webkit-sticky; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: #000; 
            width: 100%; 
            max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { 
            width: 100%; 
            display: block; 
            aspect-ratio: 16/9; 
            background: #000; 
            outline: none; 
        }

        #contentWrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #c62828; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }
        
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        /* قسم المكتبة المنظم */
        #librarySection {
            width: 95%; max-width: 700px; 
            margin: 20px auto 120px auto; 
            display: none;
        }
        
        .group-header {
            background: #1a1a1a;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #333;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .group-content {
            display: none; /* مخفي افتراضياً */
            padding: 5px 0 15px 0;
        }

        .ep-item { 
            display: flex; align-items: center; 
            background: rgba(20,20,20,0.5); margin-bottom: 5px; 
            width: 100%; border-radius: 5px; border: 1px solid #111;
        }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 12px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: center;
        }

        .ep-name-text { color: #bbbbbb !important; font-size: 15px; display: block !important; }

        .lib-control-btn { background: transparent; border: none; height: 40px; font-size: 16px; cursor: pointer; padding: 0 10px; }
        .single-delete-btn { color: #883333; }
        .single-edit-btn { color: #338833; }

        .m3u-box {
            margin-top: 15px; padding: 15px; border: 1px dashed #333; border-radius: 10px; background: #050505;
        }
        .m3u-box label { display: block; margin-bottom: 8px; font-size: 13px; color: #888; }
        
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="contentWrapper">
        <div id="admin">
            <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>
            <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
            
            <div style="border-top: 1px solid #111; margin-top: 15px; padding-top: 10px;">
                <input type="text" id="epNameInput" placeholder="اسم العمل / الحلقة">
                <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
                <button style="background: #1a3a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
            </div>

            <div class="m3u-box">
                <label>رفع ملف قنوات M3U (سيتم تنظيمها في مجموعات):</label>
                <input type="file" id="m3uFile" accept=".m3u,.m3u8" style="padding: 5px; font-size: 12px;">
                <button style="background: #4a1a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="uploadM3U()">رفع ومعالجة الملف 📁</button>
            </div>

            <div class="btn-group" style="margin-top: 15px; border-top: 1px solid #111; padding-top: 10px;">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
            </div>
            <div id="statusText">تم التحديث بنجاح ✅</div>
        </div>

        <div id="librarySection">
            <div id="episodesContainer"></div>
        </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        // --- وظائف M3U ---
        function uploadM3U() {
            const fileInput = document.getElementById('m3uFile');
            const file = fileInput.files[0];
            if (!file) { alert("الرجاء اختيار ملف أولاً"); return; }

            showStatus("جاري قراءة الملف... ⏳");
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const lines = content.split('\n');
                let channels = [];
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF:')) {
                        let groupMatch = lines[i].match(/group-title="([^"]+)"/);
                        let name = lines[i].split(',').pop().trim();
                        let url = lines[i + 1] ? lines[i + 1].trim() : "";
                        
                        if (url && url.startsWith('http')) {
                            // نحفظ اسم المجموعة بشكل منفصل لسهولة الفلترة لاحقاً
                            let groupName = groupMatch ? groupMatch[1] : "عام";
                            channels.push({ name: name, url: url, group: groupName });
                        }
                    }
                }
                
                if (channels.length > 0) {
                    if(confirm("تم العثور على " + channels.length + " قناة. هل تريد إضافتها؟")) {
                        pushChannelsSequentially(channels);
                    }
                } else {
                    alert("لم يتم العثور على قنوات صالحة");
                }
            };
            reader.readAsText(file);
        }

        async function pushChannelsSequentially(channels) {
            showStatus("جاري الرفع... 0/" + channels.length);
            for (let i = 0; i < channels.length; i++) {
                await new Promise(resolve => {
                    var xhr = new XMLHttpRequest();
                    xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
                    xhr.onload = () => resolve();
                    xhr.send(JSON.stringify(channels[i]));
                });
                if (i % 10 === 0) showStatus("تم رفع " + (i+1) + " قناة...");
            }
            showStatus("تم رفع الكل بنجاح ✅");
            loadStream();
        }

        // --- وظائف العرض والفرز (تعديل جذري للمجلدات) ---
        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#444;'>المكتبة فارغة</div>"; 
                return; 
            }
            
            // 1. تجميع القنوات حسب المجلد (Group)
            let groups = {};
            Object.keys(libData).forEach(key => {
                let ep = libData[key];
                let groupName = ep.group || "بدون تصنيف";
                if (!groups[groupName]) groups[groupName] = [];
                groups[groupName].push({ key: key, data: ep });
            });

            // 2. إنشاء HTML لكل مجموعة
            Object.keys(groups).forEach(groupName => {
                let groupWrapper = document.createElement('div');
                
                let header = document.createElement('div');
                header.className = "group-header";
                header.innerHTML = `<span>📂 ${groupName}</span> <span>${groups[groupName].length} قناة ▼</span>`;
                
                let content = document.createElement('div');
                content.className = "group-content";

                header.onclick = function() {
                    let isVisible = content.style.display === "block";
                    content.style.display = isVisible ? "none" : "block";
                    header.innerHTML = `<span>📂 ${groupName}</span> <span>${groups[groupName].length} قناة ${isVisible ? '▼' : '▲'}</span>`;
                };

                groups[groupName].forEach(item => {
                    let ep = item.data;
                    let key = item.key;
                    
                    let div = document.createElement('div');
                    div.className = "ep-item";
                    
                    let nameBox = document.createElement('div');
                    nameBox.className = "ep-name-clickable";
                    nameBox.innerHTML = `<span class="ep-name-text">${ep.name}</span>`;
                    nameBox.onclick = function() { 
                        if (isAdmin) {
                            var xhr = new XMLHttpRequest();
                            xhr.open("PATCH", dbUrl, true);
                            xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        }
                        playMedia(ep.url); 
                        window.scrollTo({top: 0, behavior: 'smooth'}); 
                    };

                    if (isAdmin) {
                        var delBtn = document.createElement('button');
                        delBtn.className = "lib-control-btn single-delete-btn";
                        delBtn.innerHTML = "✕";
                        delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                        div.appendChild(nameBox);
                        div.appendChild(delBtn);
                    } else {
                        div.appendChild(nameBox);
                    }
                    content.appendChild(div);
                });

                groupWrapper.appendChild(header);
                groupWrapper.appendChild(content);
                container.appendChild(groupWrapper);
            });
        }

        // --- باقي وظائف النظام الأصلية ---
        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف القناة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 5) videoElement.currentTime = data.time;
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                btn.innerText = isSyncEnabled ? "المزامنة: مفعلة ✅" : "المزامنة: معطلة ❌";
                btn.className = isSyncEnabled ? "btn-sync active" : "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = ""; document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة ✅"); loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url, group: "مضافة يدوياً" }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime }));
        }

        setInterval(function() {
            updatePresence();
            loadStream();
            if (isAdmin) fetchViewerCount();
        }, 8000);

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
