<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control v2</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            background-color: #050505; color: #fff;
            display: flex; flex-direction: column; align-items: center;    
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .card { 
            background: #111; padding: 10px; border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; max-width: 650px; box-sizing: border-box;
            border: 1px solid #222; margin-top: 10px;
        }
        
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        input { 
            width: 100%; padding: 12px; margin: 5px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 14px; background: #1a1a1a; color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }

        button { 
            flex: 1; padding: 12px; background-color: #222; 
            color: #ccc; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 13px; transition: 0.3s;
        }

        .btn-sync.active { background-color: #2e7d32; color: #fff; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #c62828; color: #fff; border-color: #f44336; }
        .btn-add { background-color: #1976d2; color: white; border-color: #2196f3; }
        .btn-delete-main { color: #ff4d4d; border-color: #442222; }

        /* ستايل المكتبة */
        #librarySection { width: 95%; max-width: 650px; margin-top: 20px; display: none; padding-bottom: 30px; }
        .library-title { border-bottom: 2px solid #333; padding-bottom: 5px; margin-bottom: 10px; font-size: 18px; }
        .movie-item { 
            background: #1a1a1a; padding: 12px; border-radius: 8px; 
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            border-right: 4px solid #1976d2;
        }
        .movie-info { flex: 1; cursor: pointer; }
        .movie-name { font-weight: bold; font-size: 15px; }
        .del-item { color: #ff4d4d; background: none; border: none; font-size: 18px; padding: 0 10px; flex: 0; }

        #statusText { text-align: center; font-size: 12px; color: #4caf50; margin-top: 5px; display: none; }
        h2, p, span, h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="رابط سريع (لصق مباشر لتمكين البث)" onpaste="handlePaste(event)">
        
        <div style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
            <input type="text" id="libName" placeholder="اسم الفيلم أو الحلقة">
            <input type="text" id="libUrl" placeholder="رابط الفيديو للمكتبة">
            <button class="btn-add" onclick="addToLibrary()">إضافة إلى المكتبة +</button>
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete-main" onclick="deleteVideo()">حذف البث الحالي 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="library-title">🎬 مكتبة الأفلام والمسلسلات</div>
        <div id="libraryList">
            </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var libUrlDb = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library.json";
        
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url || url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        // جلب البيانات الأساسية (بث مباشر + حالة المزامنة)
        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if (!data) return;

                    isSyncEnabled = data.syncEnabled !== false;
                    updateUIState();

                    if (isSyncEnabled) {
                        if (data.url !== lastUrl) playMedia(data.url);
                        if (Math.abs(videoElement.currentTime - data.time) > 3) {
                            videoElement.currentTime = data.time;
                        }
                        if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                        else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
                    }
                }
            };
            xhr.send();
        }

        // تحديث واجهة المستخدم (إظهار/إخفاء المكتبة)
        function updateUIState() {
            var btn = document.getElementById('syncToggleBtn');
            var libSection = document.getElementById('librarySection');
            
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
                libSection.style.display = "none";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
                libSection.style.display = "block";
                loadLibrary(); // تحميل المكتبة عند ظهورها
            }
        }

        // وظائف المكتبة
        function addToLibrary() {
            var name = document.getElementById('libName').value;
            var url = document.getElementById('libUrl').value;
            if(!name || !url) return alert("امسح الغبار واكتب البيانات كاملة!");

            var xhr = new XMLHttpRequest();
            xhr.open("POST", libUrlDb, true);
            xhr.send(JSON.stringify({ name: name, url: url }));
            
            document.getElementById('libName').value = "";
            document.getElementById('libUrl').value = "";
            showStatus("تمت الإضافة للمكتبة 📥");
            loadLibrary();
        }

        function loadLibrary() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", libUrlDb, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var listDiv = document.getElementById('libraryList');
                    listDiv.innerHTML = "";
                    for (var id in data) {
                        (function(id, item){
                            var div = document.createElement('div');
                            div.className = "movie-item";
                            div.innerHTML = `
                                <div class="movie-info" onclick="playMedia('${item.url}')">
                                    <div class="movie-name">${item.name}</div>
                                </div>
                                ${isAdmin ? `<button class="del-item" onclick="deleteFromLib('${id}')">🗑️</button>` : ''}
                            `;
                            listDiv.appendChild(div);
                        })(id, data[id]);
                    }
                }
            };
            xhr.send();
        }

        function deleteFromLib(id) {
            if(!confirm("حذف هذه الحلقة نهائياً؟")) return;
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", `https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library/${id}.json`, true);
            xhr.onload = function() { loadLibrary(); };
            xhr.send();
        }

        // أدوات التحكم الأصلية
        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateUIState();
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0, syncEnabled: true }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تشغيل البث المباشر ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف الفيديو الحالي؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({
                status: videoElement.paused ? "paused" : "playing",
                time: videoElement.currentTime
            }));
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg; status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 2000);
        }

        // التنفيذ الدوري
        setInterval(function() {
            loadStream();
            if (isAdmin && isSyncEnabled) updateDatabaseState();
        }, 3000);

        window.onload = function() {
            if(isAdmin) document.getElementById('admin').style.display = "block";
            loadStream();
        };
    </script>
</body>
</html>
