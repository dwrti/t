<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control v2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root { --primary: #007bff; --danger: #ff4d4d; --success: #2e7d32; --bg: #050505; --card-bg: #111; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg); color: #fff;
            display: flex; flex-direction: column; align-items: center;    
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto;
        }

        .card { 
            background: var(--card-bg); padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; max-width: 650px; box-sizing: border-box;
            border: 1px solid #222; margin-top: 20px;
        }
        
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        input { 
            width: 100%; padding: 12px; margin: 5px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 14px; background: #1a1a1a; color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 120px; padding: 12px; background-color: #222; 
            color: #ccc; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 14px; transition: 0.3s;
        }

        .btn-sync.active { background-color: var(--success); color: #fff; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #c62828; color: #fff; border-color: #f44336; }
        .btn-add { background-color: var(--primary); color: white; border: none; }
        .btn-delete { color: var(--danger); border-color: #442222; }

        /* ستايل المكتبة */
        #library { 
            width: 95%; max-width: 650px; margin-top: 20px; padding-bottom: 40px;
            display: none; /* مخفية افتراضياً وتظهر بالكود */
        }
        .lib-title { border-right: 4px solid var(--primary); padding-right: 10px; margin-bottom: 15px; font-size: 18px; }
        .episode-card {
            background: #1a1a1a; padding: 12px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #222; transition: 0.2s;
        }
        .episode-card:hover { border-color: #444; }
        .episode-info { cursor: pointer; flex-grow: 1; }
        .del-ep { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 18px; min-width: auto; padding: 0 10px; }

        #statusText { text-align: center; font-size: 12px; color: #4caf50; margin: 10px 0; display: none; }
        h2, p, span, h3 { display: none !important; } /* الحفاظ على طلبك بإخفاء النصوص العشوائية */
        .show-always { display: block !important; } /* لاستثناء العناوين الضرورية */
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="رابط البث المباشر الموحد...">
        
        <div style="margin-top: 15px; border-top: 1px solid #333; pt: 10px;">
            <input type="text" id="epTitle" placeholder="اسم الحلقة (مثال: الحلقة 1)">
            <input type="text" id="epUrl" placeholder="رابط الحلقة">
            <button class="btn-add" onclick="addToLibrary()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="library">
        <h2 class="lib-title show-always">🎬 مكتبة الأفلام والمسلسلات</h2>
        <div id="episodesList">
            </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var libUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (url === lastUrl) return;
            lastUrl = url;
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); return; }
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
        }

        // جلب البيانات الأساسية
        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if(data) {
                        isSyncEnabled = data.syncEnabled !== false;
                        updateSyncUI();
                        if (isSyncEnabled) {
                            syncPlayer(data);
                        }
                    }
                }
            };
            xhr.send();
            loadLibrary();
        }

        function syncPlayer(data) {
            if (data.url !== lastUrl) playMedia(data.url);
            if (Math.abs(videoElement.currentTime - data.time) > 3) {
                videoElement.currentTime = data.time;
            }
            if (data.status === "playing" && videoElement.paused) {
                videoElement.play().catch(function(e){});
            } else if (data.status === "paused" && !videoElement.paused) {
                videoElement.pause();
            }
        }

        // تحديث واجهة المزامنة والمكتبة
        function updateSyncUI() {
            var btn = document.getElementById('syncToggleBtn');
            var libDiv = document.getElementById('library');
            
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
                libDiv.style.display = "none"; // إخفاء المكتبة عند تفعيل المزامنة
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
                libDiv.style.display = "block"; // إظهار المكتبة عند تعطيل المزامنة
            }
        }

        // وظائف المكتبة
        function addToLibrary() {
            var title = document.getElementById('epTitle').value;
            var url = document.getElementById('epUrl').value;
            if(!title || !url) return alert("املا الخانات أولاً");

            var xhr = new XMLHttpRequest();
            xhr.open("POST", libUrl, true);
            xhr.send(JSON.stringify({ title: title, url: url }));
            document.getElementById('epTitle').value = "";
            document.getElementById('epUrl').value = "";
            showStatus("تمت الإضافة للمكتبة ✅");
            setTimeout(loadLibrary, 500);
        }

        function loadLibrary() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", libUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var listHtml = "";
                    for (var id in data) {
                        listHtml += `
                            <div class="episode-card">
                                <div class="episode-info" onclick="playMedia('${data[id].url}')">
                                    <span>${data[id].title}</span>
                                </div>
                                ${isAdmin ? `<button class="del-ep" onclick="deleteEpisode('${id}')">🗑️</button>` : ''}
                            </div>
                        `;
                    }
                    document.getElementById('episodesList').innerHTML = listHtml || "<p class='show-always' style='text-align:center; color:#666;'>المكتبة فارغة</p>";
                }
            };
            xhr.send();
        }

        function deleteEpisode(id) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", `https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library/${id}.json`, true);
                xhr.onload = function() { loadLibrary(); };
                xhr.send();
            }
        }

        // التحكم في البث الرئيسي
        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncUI();
        }

        function deleteVideo() {
            if(confirm("حذف فيديو البث المباشر؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
                showStatus("تم الحذف 🗑️");
            }
        }

        // مراقبة تغيير رابط البث (الأدمن)
        document.getElementById('urlInput').onpaste = function() {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = '';
                    showStatus("تم تحديث البث ✅");
                }
            }, 100);
        };

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 2000);
        }

        // التحديث الدوري
        setInterval(function() {
            loadStream();
            if (isAdmin && isSyncEnabled && !videoElement.paused) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({
                    status: videoElement.paused ? "paused" : "playing",
                    time: videoElement.currentTime
                }));
            }
        }, 3000);

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
