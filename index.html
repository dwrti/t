<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الأفلام الخاص</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header { padding: 20px; text-align: center; background: linear-gradient(to bottom, #111, transparent); }
        .player-container { max-width: 1000px; margin: 20px auto; box-shadow: 0 0 50px rgba(229, 9, 20, 0.2); }
        .controls { text-align: center; padding: 20px; }
        input { padding: 12px; width: 60%; border-radius: 25px; border: 1px solid #333; background: #222; color: white; outline: none; }
        button { padding: 12px 25px; border-radius: 25px; border: none; background: #e50914; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #ff0a16; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header">
        <h1>سينما GitHub الخاصة 🎬</h1>
    </div>

    <div class="player-container">
        <video id="player" playsinline controls data-poster="https://bit.ly/3mS89Yp">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
        </video>
    </div>

    <div class="controls">
        <input type="text" id="movieUrl" placeholder="أدخل رابط الفيلم المباشر هنا...">
        <button onclick="changeVideo()">تشغيل الآن</button>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const player = new Plyr('#player');
        function changeVideo() {
            const url = document.getElementById('movieUrl').value;
            if (url) {
                const video = document.querySelector('video');
                video.src = url;
                player.play();
            }
        }
    </script>
</body>
</html>
