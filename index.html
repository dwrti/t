<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مجلس التزامن</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        video { width: 90%; max-width: 800px; border: 2px solid #444; border-radius: 10px; margin-top: 20px; }
        input { padding: 10px; width: 60%; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>نظام التزامن (Firebase) ⚡</h2>
    
    <div id="setup">
        <input type="text" id="videoUrl" placeholder="حط رابط الفيديو المباشر هنا...">
        <button onclick="changeVideo()">شغل عند الجميع</button>
    </div>

    <video id="myVideo" controls></video>

    <script>
        // بياناتك اللي تعبت عليها (هذي هي قلب النظام)
        const firebaseConfig = {
            apiKey: "AIzaSyCDQm_qocYr7-QuAMIafyC6PuAzSbs8Q8k",
            authDomain: "axnt-68677.firebaseapp.com",
            databaseURL: "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "axnt-68677",
            storageBucket: "axnt-68677.firebasestorage.app",
            messagingSenderId: "838335964467",
            appId: "1:838335964467:web:5152329be098c9339a0a46"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("sync_data");
        const video = document.getElementById("myVideo");
        let isSyncing = false;

        // وظيفة تغيير الفيديو عند الكل
        function changeVideo() {
            const url = document.getElementById("videoUrl").value;
            db.set({ url: url, time: 0, playing: false });
        }

        // استقبال التحديثات من Firebase
        db.on("value", (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            isSyncing = true;
            
            // إذا تغير الرابط، غير الفيديو
            if (video.src !== data.url) {
                video.src = data.url;
            }

            // تزامن الوقت والتشغيل
            if (Math.abs(video.currentTime - data.time) > 1.5) video.currentTime = data.time;
            if (data.playing) video.play(); else video.pause();

            setTimeout(() => { isSyncing = false; }, 200);
        });

        // إرسال الحركة (لما تضغط بلاي أو توقف)
        const sendUpdate = () => {
            if (isSyncing) return;
            db.update({
                playing: !video.paused,
                time: video.currentTime
            });
        };

        video.onplay = sendUpdate;
        video.onpause = sendUpdate;
        video.onseeked = sendUpdate;
    </script>
</body>
</html>
