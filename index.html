<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXNT Sync</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    
    <style>
        /* هذا هو نفس تصميم صفحتك الأصلية */
        body { margin: 0; background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .video-container { position: relative; width: 100%; max-width: 900px; }
        video { width: 100%; border-radius: 8px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }
        .controls { margin-top: 20px; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 50px; }
        #status { font-size: 12px; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="mainPlayer" controls>
            <source src="https://store1.gofile.io/download/direct/67389104-e53b-4869-8084-5a6396825c89/wuVuDk.mp4" type="video/mp4">
        </video>
    </div>

    <div id="status">جاري المزامنة مع المجلس...</div>

    <script>
        // بيانات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCDQm_qocYr7-QuAMIafyC6PuAzSbs8Q8k",
            authDomain: "axnt-68677.firebaseapp.com",
            databaseURL: "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "axnt-68677",
            storageBucket: "axnt-68677.firebasestorage.app",
            messagingSenderId: "838335964467",
            appId: "1:838335964467:web:5152329be098c9339a0a46"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("axnt_sync");
        const player = document.getElementById("mainPlayer");
        let remoteChange = false;

        // استقبال الحركة من الطرف الآخر
        db.on("value", (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            remoteChange = true;
            if (Math.abs(player.currentTime - data.time) > 2) {
                player.currentTime = data.time;
            }
            if (data.playing && player.paused) player.play();
            else if (!data.playing && !player.paused) player.pause();
            
            setTimeout(() => { remoteChange = false; }, 500);
        });

        // إرسال حركتك للطرف الآخر
        const sync = () => {
            if (remoteChange) return;
            db.set({
                playing: !player.paused,
                time: player.currentTime,
                timestamp: Date.now()
            });
        };

        player.onplay = sync;
        player.onpause = sync;
        player.onseeked = sync;

        // تحديث بسيط كل 5 ثواني لضمان الدقة
        setInterval(() => {
            if (!player.paused && !remoteChange) {
                db.update({ time: player.currentTime });
            }
        }, 5000);
    </script>
</body>
</html>
