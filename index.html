<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            background-color: #050505; color: #fff;
            display: flex; flex-direction: column;
            align-items: center;    
            font-family: sans-serif; overflow-x: hidden;
        }

        .card { 
            background: #111; padding: 10px; border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; max-width: 650px; box-sizing: border-box;
            border: 1px solid #222; margin-top: 20px;
        }
        
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        .input-group { margin-bottom: 15px; background: #111; padding: 10px; border-radius: 10px; border: 1px solid #222; }
        
        input { 
            width: 100%; padding: 12px; margin: 5px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 14px; background: #1a1a1a; color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 5px; }

        button { 
            flex: 1; padding: 12px; background-color: #222; 
            color: #ccc; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 14px; transition: 0.3s;
        }

        .btn-add { background-color: #0066ff !important; color: white !important; border: none; }
        .btn-sync.active { background-color: #2e7d32; color: #fff; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #c62828; color: #fff; border-color: #f44336; }
        .btn-delete { color: #ff4d4d; border-color: #442222; }

        /* ستايل المكتبة */
        #librarySection { width: 95%; max-width: 650px; margin-top: 20px; padding-bottom: 40px; }
        .library-title { font-size: 18px; margin-bottom: 10px; border-right: 4px solid #0066ff; padding-right: 10px; }
        .episodes-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .episode-item { 
            background: #161616; padding: 15px; border-radius: 10px; 
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #222;
        }
        .ep-info { cursor: pointer; flex-grow: 1; }
        .ep-name { font-weight: bold; color: #fff; display: block; }
        .ep-del-btn { background: #331111; color: #ff4d4d; border: 1px solid #441111; padding: 5px 10px; border-radius: 5px; font-size: 12px; margin-right: 10px; flex-shrink: 0; }

        #statusText { text-align: center; font-size: 12px; color: #4caf50; margin-top: 10px; display: none; }
        h2, p, span, h3 { display: none !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="رابط البث المباشر السريع..." onpaste="handlePaste(event)">
            <div class="btn-group">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف فيديو البث 🗑️</button>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="epName" placeholder="اسم الحلقة (مثال: الحلقة 1)">
            <input type="text" id="epUrl" placeholder="رابط الحلقة">
            <button class="btn-add" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="library-title">مكتبة الأفلام والمسلسلات</div>
        <div id="episodesList" class="episodes-grid">
            </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var baseUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/";
        var dbUrl = baseUrl + "live_stream.json";
        var libUrl = baseUrl + "library.json";
        
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        // تشغيل الفيديو
        function playMedia(url) {
            if (!url || url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(e => {});
        }

        // --- وظائف المكتبة ---

        function addEpisode() {
            var name = document.getElementById('epName').value;
            var url = document.getElementById('epUrl').value;
            if(!name || !url) return alert("امسح الخانات وعبيها صح");

            var xhr = new XMLHttpRequest();
            xhr.open("POST", libUrl, true);
            xhr.send(JSON.stringify({ name: name, url: url }));
            
            document.getElementById('epName').value = "";
            document.getElementById('epUrl').value = "";
            showStatus("تمت إضافة الحلقة للمكتبة ✅");
            loadLibrary();
        }

        function loadLibrary() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", libUrl, true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var container = document.getElementById('episodesList');
                    container.innerHTML = "";
                    for (var id in data) {
                        var item = data[id];
                        var html = `
                            <div class="episode-item">
                                <div class="ep-info" onclick="playMedia('${item.url}')">
                                    <span class="ep-name">${item.name}</span>
                                </div>
                                ${isAdmin ? `<button class="ep-del-btn" onclick="deleteEpisode('${id}')">حذف 🗑️</button>` : ''}
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                }
            };
            xhr.send();
        }

        function deleteEpisode(id) {
            if(!confirm("حذف هذه الحلقة نهائياً؟")) return;
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", baseUrl + "library/" + id + ".json", true);
            xhr.onload = function() { loadLibrary(); };
            xhr.send();
        }

        // --- وظائف المزامنة ---

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false;
            updateSyncButtonUI();

            // إخفاء/إظهار المكتبة بناءً على المزامنة
            var lib = document.getElementById('librarySection');
            if (isSyncEnabled) {
                lib.classList.add('hidden');
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) {
                    videoElement.currentTime = data.time;
                }
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            } else {
                lib.classList.remove('hidden');
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) syncPlayer(JSON.parse(xhr.responseText));
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: معطلة (المكتبة ظاهرة) ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({
                status: videoElement.paused ? "paused" : "playing",
                time: videoElement.currentTime
            }));
        }

        setInterval(function() {
            loadStream();
            if (isAdmin && isSyncEnabled) updateDatabaseState();
        }, 2000);

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0, syncEnabled: true }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم إرسال رابط البث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            showStatus("تم حذف رابط البث 🗑️");
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 2500);
        }

        window.onload = function() {
            loadStream();
            loadLibrary();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
