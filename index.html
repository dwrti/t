<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* إعدادات الصفحة الأساسية */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000000; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .card { 
            position: -webkit-sticky; position: sticky; 
            top: 0; z-index: 1000; background: #000; 
            width: 100%; max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; outline: none; }

        #contentWrapper { width: 100%; display: flex; flex-direction: column; align-items: center; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: #0a0a0a; color: #4caf50; padding: 8px;
            border-radius: 8px; text-align: center; font-size: 14px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }

        input, select { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #222; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #111; 
            color: #fff; border: 1px solid #222; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #c62828; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }
        .btn-m3u { background: #5e35b1; border: none; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; font-weight: bold; }
        
        /* قسم المكتبة والتصنيفات */
        #librarySection { width: 95%; max-width: 700px; margin: 20px auto 120px auto; }
        
        .category-group { margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .category-title { 
            background: #111; padding: 10px; border-radius: 5px; 
            color: #4caf50; font-size: 16px; margin-bottom: 10px; 
            border-right: 4px solid #4caf50;
        }

        .ep-list { display: flex; flex-direction: column; }
        .ep-item { display: flex; align-items: center; background: #080808; margin-bottom: 5px; border-radius: 5px; }
        .ep-name-clickable { flex-grow: 1; padding: 12px; cursor: pointer; text-align: right; }
        .ep-name-text { color: #bbb !important; font-size: 15px; }
        .lib-control-btn { background: transparent; border: none; padding: 0 15px; cursor: pointer; font-size: 16px; }
        .single-delete-btn { color: #833; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="contentWrapper">
        <div id="admin">
            <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>
            
            <input type="text" id="urlInput" placeholder="رابط البث السريع (Paste هنا لتشغيل فوري)..." onpaste="handlePaste(event)">
            
            <div style="border-top: 1px solid #111; margin-top: 15px; padding-top: 10px;">
                <input type="text" id="epNameInput" placeholder="اسم القناة أو المقطع">
                <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
                <input type="text" id="epCatInput" placeholder="التصنيف (رياضة، أفلام...)">
                <button style="background: #1a3a8a; color: white; width: 100%; border: none; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
            </div>

            <div style="border-top: 1px solid #111; margin-top: 15px; padding-top: 10px;">
                <input type="text" id="m3uUrlInput" placeholder="رابط ملف M3U خارجي...">
                <div class="btn-group">
                    <button class="btn-m3u" onclick="importM3UFromUrl()">استيراد من رابط</button>
                    <button class="btn-m3u" onclick="document.getElementById('m3uFileInput').click()">رفع ملف M3U</button>
                    <input type="file" id="m3uFileInput" class="hidden" accept=".m3u,.m3u8" onchange="importM3UFromFile(event)">
                </div>
            </div>

            <div class="btn-group" style="margin-top: 15px; border-top: 1px solid #111; padding-top: 10px;">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف البث الحالي 🗑️</button>
                <button class="btn-delete" onclick="deleteAllLibrary()">حذف كل المكتبة 🔥</button>
            </div>
            <div id="statusText"></div>
        </div>

        <div id="librarySection">
            <div id="episodesContainer"></div>
        </div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var libUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        // --- وظائف المكتبة والتصنيفات ---

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#444;'>المكتبة فارغة</div>"; 
                return; 
            }

            // تجميع القنوات حسب التصنيف
            var categories = {};
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var cat = ep.category || "عام";
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push({key: key, data: ep});
            });

            // إنشاء العناصر في HTML
            Object.keys(categories).forEach(function(catName) {
                var catDiv = document.createElement('div');
                catDiv.className = "category-group";
                catDiv.innerHTML = '<div class="category-title">' + catName + '</div>';
                
                var listDiv = document.createElement('div');
                listDiv.className = "ep-list";

                categories[catName].forEach(function(item) {
                    var epItem = document.createElement('div');
                    epItem.className = "ep-item";
                    
                    var nameBox = document.createElement('div');
                    nameBox.className = "ep-name-clickable";
                    nameBox.innerHTML = '<span class="ep-name-text">' + item.data.name + '</span>';
                    nameBox.onclick = function() { 
                        if (isAdmin) {
                            updateLiveStream(item.data.url, item.data.name);
                        }
                        playMedia(item.data.url); 
                        window.scrollTo({top: 0, behavior: 'smooth'}); 
                    };

                    epItem.appendChild(nameBox);

                    if (isAdmin) {
                        var delBtn = document.createElement('button');
                        delBtn.className = "lib-control-btn single-delete-btn";
                        delBtn.innerHTML = "✕";
                        delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(item.key); };
                        epItem.appendChild(delBtn);
                    }
                    
                    listDiv.appendChild(epItem);
                });
                
                catDiv.appendChild(listDiv);
                container.appendChild(catDiv);
            });
        }

        // --- استيراد M3U ---

        function parseM3U(content) {
            var lines = content.split('\n');
            var channels = [];
            var currentCat = "غير مصنف";

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    var name = line.split(',').pop() || "قناة غير معروفة";
                    var catMatch = line.match(/group-title="([^"]+)"/);
                    if (catMatch) currentCat = catMatch[1];
                    
                    var url = lines[i+1] ? lines[i+1].trim() : "";
                    if (url && !url.startsWith('#')) {
                        channels.push({ name: name, url: url, category: currentCat });
                    }
                }
            }
            return channels;
        }

        function uploadBatch(channels) {
            if (channels.length === 0) return;
            showStatus("جاري رفع " + channels.length + " قناة...");
            
            // رفع القنوات الواحدة تلو الأخرى لتجنب مشاكل Firebase في الطلبات الضخمة
            var count = 0;
            channels.forEach(function(ch) {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", libUrl, true);
                xhr.onload = function() {
                    count++;
                    if (count === channels.length) {
                        showStatus("تم استيراد الكل ✅");
                        loadStream();
                    }
                };
                xhr.send(JSON.stringify(ch));
            });
        }

        function importM3UFromUrl() {
            var url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return;
            showStatus("جاري جلب الملف...");
            fetch(url).then(r => r.text()).then(text => {
                var channels = parseM3U(text);
                uploadBatch(channels);
            }).catch(e => showStatus("فشل جلب الرابط ❌"));
        }

        function importM3UFromFile(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                var channels = parseM3U(e.target.result);
                uploadBatch(channels);
            };
            reader.readAsText(file);
        }

        // --- وظائف النظام الأساسية ---

        function updateLiveStream(url, name) {
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ url: url, status: "playing", time: 0 }));
            showStatus("يعمل الآن: " + name);
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            var cat = document.getElementById('epCatInput').value.trim() || "عام";
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", libUrl, true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة ✅");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url, category: cat }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه القناة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { loadStream(); };
                xhr.send();
            }
        }

        function deleteAllLibrary() {
            if(confirm("⚠️ هل أنت متأكد من حذف المكتبة بالكامل؟ لا يمكن التراجع!")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", libUrl, true);
                xhr.onload = function() { showStatus("تم مسح المكتبة 🔥"); loadStream(); };
                xhr.send();
            }
        }

        // --- الكود الأصلي المعدل للمزامنة ---

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if (data) syncPlayer(data);
                }
            };
            xhr.send();
        }

        function syncPlayer(data) {
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            
            // عرض المكتبة دائماً للأدمن، وللمشاهد فقط إذا كانت المزامنة معطلة
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }

            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 4) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function toggleSync() {
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (!btn) return;
            btn.innerText = isSyncEnabled ? "المزامنة: مفعلة ✅" : "المزامنة: معطلة ❌";
            btn.className = isSyncEnabled ? "btn-sync active" : "btn-sync inactive";
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث البث المباشر ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            showStatus("تم إيقاف البث");
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            setTimeout(() => status.innerText = "", 4000);
        }

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0; var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(k => {
                            if (now - data[k] < 15000) count++;
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        setInterval(() => {
            updatePresence();
            loadStream();
            if(isAdmin) fetchViewerCount();
        }, 5000);

        window.onload = function() {
            if(isAdmin) document.getElementById('admin').style.display = "block";
            loadStream();
        };
    </script>
</body>
</html>
