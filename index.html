<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4caf50;
            --danger: #ff4d4d;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --input-bg: #222;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); color: #fff;
            display: flex; flex-direction: column;
            align-items: center;    
            overflow-x: hidden; overflow-y: auto; 
            font-family: 'Cairo', sans-serif;
        }

        /* حاوية الفيديو */
        .video-container { 
            width: 100%; max-width: 700px; position: sticky; top: 0; z-index: 100;
            background: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        /* منطقة التحكم (للأدمن) */
        #admin { 
            display: none; width: 92%; max-width: 650px; 
            background: var(--card-bg); margin-top: 15px; 
            padding: 15px; border-radius: 15px; border: 1px solid #333;
        }
        
        .admin-section { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        .admin-section:last-child { border: none; }

        input { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #333; border-radius: 10px; 
            font-size: 14px; background: var(--input-bg); color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; 
            border: none; border-radius: 10px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: 0.2s; color: white;
        }

        .btn-add { background-color: #1e40af; width: 100%; margin-top: 5px; }
        .btn-sync.active { background-color: var(--primary); }
        .btn-sync.inactive { background-color: #555; }
        .btn-delete { background-color: #331111; color: var(--danger); border: 1px solid #442222; }

        #statusText { 
            text-align: center; font-size: 13px; color: var(--primary); 
            margin: 10px 0; font-weight: bold;
        }

        /* ستايل المكتبة */
        #librarySection {
            width: 92%; max-width: 650px; margin: 20px 0 40px 0;
            display: none;
        }
        .lib-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding: 0 5px;
        }
        .lib-title { font-size: 18px; font-weight: bold; color: var(--primary); }
        
        .ep-list { 
            display: grid; grid-template-columns: 1fr; gap: 10px;
        }
        
        .ep-item { 
            display: flex; align-items: center;
            background: var(--card-bg); border-radius: 12px;
            border: 1px solid #252525; overflow: hidden;
            transition: transform 0.2s, border 0.2s;
        }
        .ep-item:active { transform: scale(0.98); border-color: var(--primary); }
        
        .ep-info {
            flex-grow: 1; padding: 15px; cursor: pointer;
            display: flex; align-items: center;
        }
        .ep-icon { margin-left: 12px; color: var(--primary); font-size: 20px; }
        .ep-name-text { font-size: 15px; font-weight: 500; }

        .single-delete-btn {
            padding: 15px; color: #666; font-size: 18px;
            border-right: 1px solid #252525; cursor: pointer;
        }
        .single-delete-btn:hover { color: var(--danger); }

        /* إخفاء العناصر غير الضرورية */
        h2, p, span:empty, h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div class="admin-section">
            <input type="text" id="urlInput" placeholder="ضع رابط البث المباشر هنا..." onpaste="handlePaste(event)">
        </div>
        
        <div class="admin-section">
            <input type="text" id="epNameInput" placeholder="اسم الفيلم أو الحلقة">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر">
            <button class="btn-add" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
        </div>
        <div id="statusText"></div>
    </div>

    <div id="librarySection">
        <div class="lib-header">
            <div class="lib-title">المكتبة المتوفرة</div>
        </div>
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#666;'>المكتبة فارغة حالياً</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var info = document.createElement('div');
                info.className = "ep-info";
                info.innerHTML = '<div class="ep-icon">▶</div><div class="ep-name-text">' + ep.name + '</div>';
                info.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("جاري تشغيل: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                item.appendChild(info);

                if (isAdmin) {
                    var delBtn = document.createElement('div');
                    delBtn.className = "single-delete-btn";
                    delBtn.innerHTML = "🗑️";
                    delBtn.onclick = function() { deleteSingleEpisode(key); };
                    item.appendChild(delBtn);
                }

                container.appendChild(item);
            });
        }

        // --- باقي دوال الـ JavaScript المتبقية بنفس منطقك السابق لضمان عمل الوظائف ---

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل الاسم والرابط"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة بنجاح");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            if (!isAdmin) loadStream();
            else { if (isSyncEnabled) updateDatabaseState(); loadStream(); }
        }, 2000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث الرابط الأساسي ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف فيديو البث الحالي؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            setTimeout(function() { status.innerText = ""; }, 3000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
