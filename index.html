<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100%; 
            background-color: #050505; color: #fff;
            display: flex; flex-direction: column;
            align-items: center; font-family: sans-serif;
            overflow-x: hidden;
        }

        .card { 
            background: #111; padding: 10px; border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; max-width: 650px; box-sizing: border-box;
            border: 1px solid #222; margin-top: 20px;
        }
        
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        input { 
            width: 100%; padding: 12px; margin: 5px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 15px; background: #1a1a1a; color: #fff;
            box-sizing: border-box; text-align: center; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }

        button { 
            flex: 1; padding: 12px; background-color: #222; 
            color: #ccc; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 14px; transition: 0.3s;
        }

        .btn-sync.active { background-color: #2e7d32; color: #fff; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #c62828; color: #fff; border-color: #f44336; }
        .btn-add { background-color: #1976d2; color: #fff; border-color: #2196f3; }
        .btn-delete { color: #ff4d4d; border-color: #442222; }

        /* ستايل المكتبة */
        #library { 
            width: 95%; max-width: 650px; margin-top: 20px; 
            padding-bottom: 30px; display: none; 
        }
        .library-title { font-size: 18px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .episode-item {
            background: #161616; padding: 12px; border-radius: 8px;
            margin-bottom: 8px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid #222;
        }
        .episode-info { cursor: pointer; flex-grow: 1; }
        .del-ep { background: #331111; color: #ff4d4d; padding: 5px 10px; font-size: 12px; border: 1px solid #552222; margin-right: 10px; flex-shrink: 0; }

        #statusText { text-align: center; font-size: 12px; color: #4caf50; margin-top: 5px; display: none; }
        h2, p, span, h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
        
        <div style="border: 1px dashed #333; padding: 10px; border-radius: 8px; margin-top: 10px;">
            <input type="text" id="epName" placeholder="اسم الحلقة (مثال: الحلقة 1)">
            <input type="text" id="epUrl" placeholder="رابط الحلقة...">
            <button class="btn-add" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="library">
        <div class="library-title">🎬 مكتبة الأفلام والمسلسلات</div>
        <div id="episodeList"></div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var epUrlDb = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url || url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText) || {};
                    isSyncEnabled = data.syncEnabled !== false;
                    updateSyncUI();
                    if (isSyncEnabled) {
                        if (data.url !== lastUrl) playMedia(data.url);
                        if (Math.abs(videoElement.currentTime - (data.time || 0)) > 3) {
                            videoElement.currentTime = data.time || 0;
                        }
                        if (data.status === "playing" && videoElement.paused) videoElement.play().catch(e=>{});
                        else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
                    }
                }
            };
            xhr.send();
        }

        function updateSyncUI() {
            var btn = document.getElementById('syncToggleBtn');
            var lib = document.getElementById('library');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
                lib.style.display = "none";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
                lib.style.display = "block";
                loadLibrary();
            }
        }

        // مكتبة الأفلام
        function addEpisode() {
            var name = document.getElementById('epName').value;
            var url = document.getElementById('epUrl').value;
            if (!name || !url) return alert("املا الخانات");
            var xhr = new XMLHttpRequest();
            xhr.open("POST", epUrlDb, true);
            xhr.send(JSON.stringify({ name: name, url: url }));
            document.getElementById('epName').value = "";
            document.getElementById('epUrl').value = "";
            showStatus("تمت الإضافة للمكتبة ✅");
            loadLibrary();
        }

        function loadLibrary() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", epUrlDb, true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var list = document.getElementById('episodeList');
                    list.innerHTML = "";
                    for (var id in data) {
                        (function(id, item) {
                            var div = document.createElement('div');
                            div.className = "episode-item";
                            div.innerHTML = `<div class="episode-info" onclick="playMedia('${item.url}')">🔹 ${item.name}</div>`;
                            if (isAdmin) {
                                var delBtn = document.createElement('button');
                                delBtn.className = "del-ep";
                                delBtn.innerText = "حذف";
                                delBtn.onclick = function() { deleteEpisode(id); };
                                div.appendChild(delBtn);
                            }
                            list.appendChild(div);
                        })(id, data[id]);
                    }
                }
            };
            xhr.send();
        }

        function deleteEpisode(id) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", `https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/library/${id}.json`, true);
                xhr.onload = function() { loadLibrary(); };
                xhr.send();
            }
        }

        function toggleSync() {
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncUI();
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime }));
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث البث المباشر ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف رابط البث المباشر؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
                showStatus("تم حذف الرابط 🗑️");
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg; status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 2000);
        }

        setInterval(function() {
            loadStream();
            if (isAdmin && isSyncEnabled) updateDatabaseState();
        }, 2500);

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
