<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #050505; color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            overflow: hidden;
        }

        .card { 
            background: #111; 
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; 
            max-width: 650px; 
            box-sizing: border-box;
            border: 1px solid #222;
        }
        
        video { 
            width: 100%; 
            border-radius: 8px; 
            background: #000; 
            aspect-ratio: 16/9;
            display: block;
        }

        #admin { 
            display: none; 
            width: 95%;
            max-width: 650px;
            margin-top: 15px;
        }
        
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 5px 0; 
            border: 1px solid #333; 
            border-radius: 8px; 
            font-size: 16px; 
            background: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
            text-align: center;
            outline: none;
        }

        input:focus { border-color: #007bff; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }

        button { 
            flex: 1;
            padding: 12px; 
            background-color: #222; 
            color: #777;
            border: 1px solid #333; 
            border-radius: 8px; 
            cursor: pointer; 
            height: 45px;
            font-size: 14px;
            transition: 0.3s;
        }

        button:hover { background-color: #2a2a2a; color: #fff; }

        .btn-delete { color: #ff4d4d; border-color: #442222; }
        .btn-delete:hover { background-color: #441111; color: #ff4d4d; }

        #statusText {
            text-align: center;
            font-size: 12px;
            color: #4caf50;
            margin-top: 5px;
            display: none;
        }

        h2, p, span, h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="ألصق الرابط هنا ليتم التحديث فوراً..." onpaste="handlePaste(event)">
        <div class="btn-group">
            <button class="btn-delete" onclick="deleteVideo()">حذف الفيديو 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";

        function playMedia(url) {
            if (url === lastUrl) return;
            lastUrl = url;

            if (!url) {
                videoElement.src = "";
                if (hls) hls.destroy();
                return;
            }
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(videoElement);
            } else {
                videoElement.src = url;
            }
        }

        // --- وظائف المزامنة اللحظية ---

        function syncPlayer(data) {
            if (!data) return;

            // 1. تحديث الرابط إذا تغير
            if (data.url !== lastUrl) {
                playMedia(data.url);
            }

            // 2. مزامنة الوقت (إذا كان الفرق أكثر من ثانيتين)
            if (Math.abs(videoElement.currentTime - data.time) > 2) {
                videoElement.currentTime = data.time;
            }

            // 3. مزامنة الحالة (تشغيل/إيقاف)
            if (data.status === "playing" && videoElement.paused) {
                videoElement.play().catch(function(e){});
            } else if (data.status === "paused" && !videoElement.paused) {
                videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        // إرسال حالة الأدمن للقاعدة تلقائياً عند تغيير حالة الفيديو
        if (isAdmin) {
            var events = ['play', 'pause', 'seeked'];
            events.forEach(function(ev) {
                videoElement.addEventListener(ev, function() {
                    updateDatabaseState();
                });
            });
        }

        function updateDatabaseState() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true); // استخدام PATCH لتحديث حقول معينة فقط
            var state = {
                status: videoElement.paused ? "paused" : "playing",
                time: videoElement.currentTime
            };
            xhr.send(JSON.stringify(state));
        }

        // فحص التحديثات كل ثانية لمزامنة دقيقة
        setInterval(function() {
            if (!isAdmin) {
                loadStream();
            } else {
                // الأدمن يرسل وقته الحالي كل ثانيتين لضمان مزامنة المشاهدين الجدد
                updateDatabaseState();
            }
        }, 2000);

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    sendToDatabase(val);
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث بنجاح ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("هل أنت متأكد من حذف الفيديو الحالي؟")) {
                sendToDatabase("");
                showStatus("تم حذف الفيديو 🗑️");
            }
        }

        function sendToDatabase(val) {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", dbUrl, true);
            xhr.send(JSON.stringify({ 
                url: val, 
                status: "playing", 
                time: 0 
            }));
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 2000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
            }
        };
    </script>
</body>
</html>
