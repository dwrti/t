<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغلي الذكي 📺</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #eee; font-family: sans-serif; overflow: hidden; }
        .card { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
        video, iframe { width: 100%; height: 100%; border: none; display: none; }
        #adminLink { position: fixed; bottom: 10px; right: 10px; color: #333; text-decoration: none; font-size: 10px; }
    </style>
</head>
<body>

<div class="card">
    <video id="myPlayer" controls autoplay playsinline></video>
    <iframe id="myIframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
</div>

<a href="#ana" id="adminLink">.</a>

<script>
    var video = document.getElementById('myPlayer');
    var iframe = document.getElementById('myIframe');
    var hls = new Hls();
    var lastUrl = "";
    var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";

    function playMedia(url) {
        if (!url || url === lastUrl) return;
        lastUrl = url;

        // التحقق من نوع الرابط
        var isDirectVideo = url.includes('.m3u8') || url.includes('.mp4') || url.includes('.ts');

        if (isDirectVideo) {
            iframe.style.display = "none"; iframe.src = "";
            video.style.display = "block";
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(video);
            } else { video.src = url; }
            video.play().catch(e => console.log("Auto-play blocked"));
        } else {
            video.pause(); video.style.display = "none";
            iframe.style.display = "block";
            iframe.src = url;
        }
    }

    function checkUpdate() {
        fetch(dbUrl + "?t=" + new Date().getTime())
        .then(r => r.json())
        .then(data => { if(data && data.url) playMedia(data.url); });
    }

    setInterval(checkUpdate, 5000); // تحديث كل 5 ثوانٍ
    checkUpdate();
</script>
</body>
</html>
