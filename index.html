<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D-Terminal | أبطال الديجيتال</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* ثيم أبطال الديجيتال الجزء الثالث - Digimon Tamers */
        :root {
            --digi-red: #e63946;
            --digi-gold: #ffb703;
            --digi-blue: #00b4d8;
            --digi-dark: #1a1a1d;
            --digi-border: #444;
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #0d0d0d; 
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
            background-size: 30px 30px; /* خلفية شبكية رقمية */
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }

        body {
            display: flex; flex-direction: column;
            align-items: center;
        }

        /* تصميم إطار المشغل - مستوحى من الـ D-Ark */
        .card { 
            background: #222; 
            padding: 10px; 
            border-radius: 0 0 25px 25px; 
            width: 100%; max-width: 650px; box-sizing: border-box;
            border: 4px solid var(--digi-red);
            border-top: none;
            box-shadow: 0 10px 20px rgba(230, 57, 70, 0.3);
            z-index: 10;
            position: sticky; top: 0; 
        }
        
        video { 
            width: 100%; display: block; aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.2);
        }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 15px; }
        
        #viewerCount {
            background: rgba(0, 180, 216, 0.1);
            color: var(--digi-blue);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--digi-blue);
            text-shadow: 0 0 5px var(--digi-blue);
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid var(--digi-border); border-radius: 8px; 
            font-size: 14px; background: #151515; color: #fff;
            box-sizing: border-box; outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--digi-gold); }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #333; 
            color: #fff; border: 2px solid var(--digi-border); border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        button:hover { background-color: #444; border-color: var(--digi-gold); }

        .btn-sync.active { background-color: #1b5e20; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #ff5252; }
        .btn-delete { color: #ff5252; border-color: #5d1b1b; }

        #statusText { text-align: center; font-size: 13px; color: var(--digi-gold); margin: 10px 0; font-weight: bold; }
        
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        /* قسم المكتبة - عالم الأرقام */
        #librarySection {
            width: 95%; max-width: 650px; 
            margin: 40px auto 100px auto; 
            background: rgba(20, 20, 20, 0.9); 
            border-radius: 12px; 
            border: 2px solid var(--digi-red);
            padding: 15px; box-sizing: border-box; display: none;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.1);
        }
        
        .lib-title { 
            font-size: 17px; margin-bottom: 15px; padding-right: 12px; 
            color: var(--digi-gold); font-weight: bold; 
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .lib-title::before { content: "💿 قـائمة الاتـصال الرقمي 💿"; }

        .ep-list { max-height: none; overflow: visible; }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: #1a1a1a; margin-bottom: 10px; border-radius: 8px;
            border: 1px solid #333; overflow: hidden;
            flex-direction: row-reverse;
            transition: all 0.2s;
        }
        .ep-item:hover { border-color: var(--digi-blue); background: #222; }
        .ep-item:active { transform: scale(0.98); } 

        .ep-name-clickable {
            flex-grow: 1; padding: 15px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: right;
        }

        .ep-name-text { 
            color: #fff !important; 
            font-size: 15px; 
            display: block !important;
            pointer-events: none;
        }

        .lib-control-btn {
            background: transparent; border: none; 
            height: 50px; font-size: 18px; 
            cursor: pointer; display: none; 
            flex-shrink: 0; outline: none; padding: 0 12px;
        }
        
        .single-delete-btn { color: #ff4444; }
        .single-edit-btn { color: var(--digi-blue); }

        /* لمسة جمالية للبطاقة المضافة */
        .ep-item::after {
            content: '';
            width: 5px;
            height: 100%;
            background: var(--digi-red);
            order: -1;
        }
        
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">عدد المتصلين الآن: جاري التحميل...</div>

        <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
        
        <div style="border-top: 1px solid #333; margin-top: 15px; padding-top: 10px;">
            <input type="text" id="epNameInput" placeholder="اسم العمل / الحلقة">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
            <button style="background: var(--digi-red); color: white; width: 100%; border: none; margin-top: 5px; border-radius: 8px;" onclick="addEpisode()">إضافة للديجيفايس +</button>
        </div>

        <div class="btn-group" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">قطع الاتصال 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="lib-title"></div> 
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        /* الكود البرمجي الأصلي كما هو بدون أي تعديل لضمان العمل بنسبة 100% */
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "عدد المتصلين الآن: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#666; display:block !important;'>المكتبة فارغة.. ابدأ بإضافة حلقاتك!</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("جاري البث الرقمي: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "lib-control-btn single-delete-btn";
                    delBtn.style.display = "block";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    
                    var editBtn = document.createElement('button');
                    editBtn.className = "lib-control-btn single-edit-btn";
                    editBtn.style.display = "block";
                    editBtn.innerHTML = "✏️";
                    editBtn.onclick = function(e) { e.stopPropagation(); editSingleEpisode(key, ep.name, ep.url); };

                    item.appendChild(delBtn);
                    item.appendChild(editBtn);
                }
                
                item.appendChild(nameBox);
                container.appendChild(item);
            });
        }

        function editSingleEpisode(key, oldName, oldUrl) {
            var newName = prompt("تعديل اسم المقطع:", oldName);
            if (newName === null) return;
            var newUrl = prompt("تعديل رابط المقطع:", oldUrl);
            if (newUrl === null) return;
            if (newName.trim() === "" || newUrl.trim() === "") { alert("لا يمكن ترك الحقول فارغة"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم تعديل البيانات الرقمية ✅"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف من القاعدة"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: مفعلة ✅";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: معطلة ❌";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل الاسم والرابط"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة المقطع للديجيفايس");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("قطع اتصال البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
