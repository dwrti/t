<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Streaming Library - Dark Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-color: #8b5cf6;
            --bg-dark: #09090b;
            --card-bg: #18181b;
            --input-bg: #27272a;
            --text-main: #f4f4f5;
            --text-dim: #a1a1aa;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); color: var(--text-main);
            display: flex; flex-direction: column;
            align-items: center;    
            overflow-x: hidden; overflow-y: auto; 
            font-family: 'Tajawal', sans-serif;
        }

        /* حاوية الفيديو */
        .video-container { 
            width: 100%; max-width: 650px; 
            background: #000;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        /* الأقسام الرئيسية */
        .content-wrapper {
            width: 92%; max-width: 650px;
            padding-bottom: 40px;
        }

        .section-card { 
            background: var(--card-bg); padding: 20px; border-radius: 20px; 
            border: 1px solid #27272a; margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #admin { display: none; }
        
        input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border: 1px solid #3f3f46; border-radius: 12px; 
            font-size: 14px; background: var(--input-bg); color: #fff;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 14px; 
            background-color: #27272a; color: #fff; 
            border: none; border-radius: 12px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }
        button:active { transform: scale(0.96); }

        .btn-add { background: var(--primary-gradient) !important; color: white; }
        .btn-sync.active { background: #065f46 !important; color: #34d399; }
        .btn-sync.inactive { background: #7f1d1d !important; color: #f87171; }
        .btn-delete { background: #450a0a !important; color: #f87171; border: 1px solid #7f1d1d; }

        /* تصميم المكتبة */
        .lib-header { 
            display: flex; align-items: center; gap: 10px; 
            margin-bottom: 20px; padding-right: 5px;
        }
        .lib-header h2 { 
            font-size: 1.2rem; margin: 0; color: var(--text-main); 
            display: block !important; 
        }
        .dot { height: 10px; width: 10px; background: var(--accent-color); border-radius: 50%; box-shadow: 0 0 10px var(--accent-color); }

        .ep-list { display: flex; flex-direction: column; gap: 12px; }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: #212124; border-radius: 15px;
            padding: 12px 15px; border: 1px solid #2d2d30;
            transition: background 0.3s;
        }
        
        .ep-info {
            flex-grow: 1; display: flex; align-items: center; gap: 12px;
            cursor: pointer; text-decoration: none;
        }

        .play-icon {
            width: 35px; height: 35px; background: rgba(139, 92, 246, 0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--accent-color); font-size: 18px;
        }

        .ep-name-text { 
            color: var(--text-main) !important; font-size: 15px; font-weight: 500;
            display: block !important;
        }

        .single-delete-btn {
            background: transparent; color: #ef4444; border: none;
            padding: 8px; font-size: 18px; cursor: pointer;
        }

        #statusText { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 50px;
            border: 1px solid var(--accent-color); font-size: 13px; z-index: 1000;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div class="content-wrapper">
        <div id="admin" class="section-card">
            <input type="text" id="urlInput" placeholder="رابط البث الأساسي (لصق سريع)..." onpaste="handlePaste(event)">
            
            <div style="margin-top: 15px; border-top: 1px solid #2d2d30; padding-top: 15px;">
                <input type="text" id="epNameInput" placeholder="اسم الحلقة أو الفيلم">
                <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر">
                <button class="btn-add" onclick="addEpisode()" style="width: 100%; margin-top: 5px;">إضافة للمكتبة +</button>
            </div>

            <div class="btn-group" style="margin-top: 15px;">
                <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
                <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
            </div>
        </div>

        <div id="librarySection" class="section-card" style="display: none;">
            <div class="lib-header">
                <div class="dot"></div>
                <h2>المكتبة</h2>
            </div>
            <div id="episodesContainer" class="ep-list"></div>
        </div>
    </div>

    <div id="statusText" style="display: none;"></div>

    <script>
        // الكود البرمجي (Javascript) يبقى كما هو لضمان عمل الوظائف
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:20px; color:#555;'>المكتبة فارغة حالياً</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var info = document.createElement('div');
                info.className = "ep-info";
                info.innerHTML = `
                    <div class="play-icon">▶</div>
                    <span class="ep-name-text">${ep.name}</span>
                `;
                info.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("تم التغيير للجميع: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                item.appendChild(info);

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "single-delete-btn";
                    delBtn.innerHTML = "🗑️";
                    delBtn.onclick = function() { deleteSingleEpisode(key); };
                    item.appendChild(delBtn);
                }

                container.appendChild(item);
            });
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () { if (xhr.status === 200) syncPlayer(JSON.parse(xhr.responseText)); };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل الاسم والرابط"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime }));
        }

        setInterval(function() {
            if (!isAdmin) loadStream();
            else { if (isSyncEnabled) updateDatabaseState(); loadStream(); }
        }, 2000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم تحديث الرابط الأساسي ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
