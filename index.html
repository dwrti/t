<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AXNT SYNC - المتزامن</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: white; text-align: center; font-family: sans-serif; }
        .container { margin-top: 50px; }
        video { width: 80%; border: 2px solid #333; border-radius: 15px; background: #111; }
        .controls { margin-top: 20px; }
        input { padding: 10px; width: 50%; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>مجلس AXNT للتزامن ⚡</h2>
    
    <video id="vPlayer" controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video>

    <div class="controls">
        <p>إذا تبي تغير الفيديو، حط الرابط المباشر هنا:</p>
        <input type="text" id="newUrl" placeholder="ضع رابط .mp4 هنا">
        <button onclick="updateVideo()">تغيير عند الكل</button>
    </div>
</div>

<script>
    // بياناتك الصحيحة
    const firebaseConfig = {
        apiKey: "AIzaSyCDQm_qocYr7-QuAMIafyC6PuAzSbs8Q8k",
        authDomain: "axnt-68677.firebaseapp.com",
        databaseURL: "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "axnt-68677",
        storageBucket: "axnt-68677.firebasestorage.app",
        messagingSenderId: "838335964467",
        appId: "1:838335964467:web:5152329be098c9339a0a46"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("sync_room");
    const v = document.getElementById("vPlayer");
    let lock = false;

    // استقبال الأوامر
    db.on("value", (s) => {
        const data = s.val();
        if (!data) return;
        lock = true;
        
        if (v.src !== data.url && data.url) v.src = data.url;
        if (Math.abs(v.currentTime - data.t) > 1.5) v.currentTime = data.t;
        data.p ? v.play() : v.pause();
        
        setTimeout(() => lock = false, 300);
    });

    // إرسال الأوامر
    const send = () => {
        if (lock) return;
        db.set({ t: v.currentTime, p: !v.paused, url: v.src });
    };

    v.onplay = send; v.onpause = send; v.onseeked = send;

    function updateVideo() {
        const url = document.getElementById("newUrl").value;
        if(url) db.update({ url: url, t: 0, p: false });
    }
</script>
</body>
</html>
