<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Admin Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* التنسيقات العامة */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; color: #eee;
            display: flex; flex-direction: column;
            align-items: center;    
            overflow-x: hidden; overflow-y: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* حاوية الفيديو */
        .card { 
            width: 100%; max-width: 800px; 
            background: #000;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        video { width: 100%; aspect-ratio: 16/9; display: block; background: #000; }

        /* لوحة التحكم (الأدمن) */
        #admin { 
            display: none; width: 95%; max-width: 650px; 
            margin-top: 15px; background: #111; padding: 15px;
            border-radius: 12px; border: 1px solid #222; box-sizing: border-box;
        }
        
        input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border: 1px solid #333; border-radius: 8px; 
            font-size: 14px; background: #0a0a0a; color: #fff;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        button { 
            flex: 1; padding: 14px; background-color: #222; 
            color: #eee; border: 1px solid #333; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .btn-sync.active { background-color: #1b5e20; color: #fff; border-color: #2e7d32; }
        .btn-sync.inactive { background-color: #b71c1c; color: #fff; border-color: #d32f2f; }

        .btn-delete { color: #ff5252; border-color: #5d1a1a; }

        #statusText { text-align: center; font-size: 13px; color: #4caf50; margin: 10px 0; display: none; }
        h2, p, span, h3 { display: none !important; }

        /* ستايل المكتبة المطور للجوال */
        #librarySection {
            width: 95%; max-width: 650px; margin: 20px 0 40px 0;
            display: none;
        }
        
        .lib-title { 
            font-size: 20px; margin-bottom: 15px; 
            color: #fff; font-weight: bold;
            display: flex; align-items: center; gap: 10px;
        }
        .lib-title::before { content: ""; width: 4px; height: 20px; background: #4caf50; border-radius: 2px; }

        .ep-list { 
            display: grid; 
            grid-template-columns: 1fr; /* حلقة واحدة لكل سطر لسهولة القراءة */
            gap: 12px; 
        }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: #111; border-radius: 10px;
            border: 1px solid #222; overflow: hidden;
            position: relative;
        }
        
        .ep-name-clickable {
            flex-grow: 1; padding: 18px 15px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }

        .ep-name-text { 
            color: #fff !important; 
            font-size: 15px; 
            font-weight: 500;
            display: block !important;
        }

        .single-delete-btn {
            background: #221111; color: #ff5252; border: none;
            padding: 18px 20px; font-size: 18px;
            cursor: pointer; display: none;
            border-right: 1px solid #331111;
        }

        /* شريط التمرير */
        .ep-list::-webkit-scrollbar { width: 5px; }
        .ep-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="رابط البث المباشر الأساسي..." onpaste="handlePaste(event)">
        
        <div style="border-top: 1px solid #222; margin-top: 15px; padding-top: 10px;">
            <input type="text" id="epNameInput" placeholder="اسم الحلقة أو الفيلم">
            <input type="text" id="epUrlInput" placeholder="رابط الملف المباشر...">
            <button style="background: #2962ff; color: white; border:none; width: 100%; margin-top: 5px;" onclick="addEpisode()">إضافة للمكتبة +</button>
        </div>

        <div class="btn-group" style="margin-top: 20px; border-top: 1px solid #222; padding-top: 15px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">جاري التحميل...</button>
            <button class="btn-delete" onclick="deleteVideo()">حذف البث 🗑️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="lib-title">مكتبة المحتوى</div>
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // الكود البرمجي كما هو بدون أي تعديل لضمان استمرار عمل الموقع بنفس الطريقة
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:40px; color:#555; display:block !important;'>المكتبة فارغة حالياً</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("جاري تشغيل: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                item.appendChild(nameBox);

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "single-delete-btn";
                    delBtn.style.display = "block";
                    delBtn.innerHTML = "🗑️";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    item.appendChild(delBtn);
                }

                container.appendChild(item);
            });
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() {
                    showStatus("تم حذف الحلقة بنجاح");
                    loadStream();
                };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (isSyncEnabled) {
                btn.innerText = "المزامنة: مفعلة ✅";
                btn.className = "btn-sync active";
            } else {
                btn.innerText = "المزامنة: معطلة ❌";
                btn.className = "btn-sync inactive";
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل الاسم والرابط"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت إضافة: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            if (!isAdmin) loadStream();
            else { if (isSyncEnabled) updateDatabaseState(); loadStream(); }
        }, 2000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التحديث ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("حذف البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            if(isAdmin) document.getElementById('admin').style.display = "block";
        };
    </script>
</body>
</html>
