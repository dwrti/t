<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سبيستون - قناة شباب المستقبل 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* ستايل سبيستون - كوكب الإثارة والغموض */
        :root {
            --spacetoon-blue: #0051a8;
            --spacetoon-yellow: #ffcc00;
            --spacetoon-purple: #6a0dad;
            --spacetoon-bg: #0b0221;
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--spacetoon-bg);
            /* إضافة نجوم للخلفية */
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }

        body {
            display: flex; flex-direction: column;
            align-items: center;
        }

        /* حاوية الفيديو مع إطار ذهبي سبيستوني */
        .card { 
            background: #000; padding: 0; border-radius: 0; 
            width: 100%; max-width: 650px; box-sizing: border-box;
            border-bottom: 5px solid var(--spacetoon-yellow); z-index: 10;
            position: sticky; top: 0; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; }

        /* منطقة التحكم */
        #admin { display: none; width: 95%; max-width: 650px; margin-top: 20px; }
        
        #viewerCount {
            background: rgba(106, 13, 173, 0.6);
            color: var(--spacetoon-yellow);
            padding: 10px;
            border-radius: 15px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
            border: 2px solid var(--spacetoon-yellow);
            font-weight: bold;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 2px solid var(--spacetoon-blue); border-radius: 12px; 
            font-size: 14px; background: #fff; color: #333;
            box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; 
            background: var(--spacetoon-blue); 
            color: #fff; border: none; border-radius: 12px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 0 #003366;
        }

        button:active { transform: translateY(3px); box-shadow: none; }

        .btn-sync.active { background-color: #28a745; }
        .btn-sync.inactive { background-color: #dc3545; }
        .btn-delete { background-color: #ff4757; }

        #statusText { text-align: center; font-size: 14px; color: var(--spacetoon-yellow); margin: 10px 0; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        
        /* إخفاء العناصر غير المرغوبة مع لمسة جمالية */
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        /* تصميم المكتبة (كواكب سبيستون) */
        #librarySection {
            width: 95%; max-width: 650px; 
            margin: 150px auto 100px auto; 
            background: rgba(0, 81, 168, 0.2); 
            backdrop-filter: blur(10px);
            border-radius: 20px; border: 2px solid var(--spacetoon-blue);
            padding: 20px; box-sizing: border-box; display: none;
        }
        
        .lib-title { 
            font-size: 20px; margin-bottom: 15px; text-align: center;
            color: var(--spacetoon-yellow); font-weight: bold; 
            text-shadow: 1px 1px 5px #000;
            min-height: 1.2em; 
        }

        .lib-title::after { content: "قائمة الكواكب 🌌"; }

        .ep-list { max-height: none; overflow: visible; }
        
        .ep-item { 
            display: flex; align-items: center; 
            background: rgba(255, 255, 255, 0.1); margin-bottom: 10px; border-radius: 15px;
            border: 1px solid var(--spacetoon-blue); overflow: hidden;
            flex-direction: row-reverse;
            transition: all 0.2s;
        }
        
        .ep-item:hover { background: rgba(255, 255, 255, 0.2); border-color: var(--spacetoon-yellow); }
        .ep-item:active { transform: scale(0.96); } 

        .ep-name-clickable {
            flex-grow: 1; padding: 15px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: right;
        }

        .ep-name-text { 
            color: #fff !important; 
            font-size: 16px; font-weight: 500;
            display: block !important;
            pointer-events: none;
        }

        .lib-control-btn {
            background: rgba(255,255,255,0.1); border: none; 
            height: 50px; font-size: 18px; 
            cursor: pointer; display: none; 
            flex-shrink: 0; outline: none; padding: 0 15px;
        }
        
        .single-delete-btn { color: #ff6b6b; }
        .single-edit-btn { color: #1dd1a1; }
        
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">جاري رصد المتصلين من الفضاء...</div>

        <input type="text" id="urlInput" placeholder="رابط البث الجديد..." onpaste="handlePaste(event)">
        
        <div style="border-top: 2px solid var(--spacetoon-blue); margin-top: 15px; padding-top: 10px;">
            <input type="text" id="epNameInput" placeholder="اسم المسلسل أو الحلقة">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
            <button style="background: var(--spacetoon-purple); color: white; width: 100%; border: none; margin-top: 5px;" onclick="addEpisode()">إضافة للمجرة +</button>
        </div>

        <div class="btn-group" style="margin-top: 15px; border-top: 2px solid var(--spacetoon-blue); padding-top: 10px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">انتظر الرد...</button>
            <button class="btn-delete" onclick="deleteVideo()">إيقاف الإرسال ☄️</button>
        </div>
        <div id="statusText">تم التحديث بنجاح ✅</div>
    </div>

    <div id="librarySection">
        <div class="lib-title"></div> 
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // الكود البرمجي الأصلي كما هو دون أي تغيير في المنطق
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "المشاهدون من شباب المستقبل: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#aaa; display:block !important;'>الفضاء فارغ حالياً.. أضف بعض المسلسلات!</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">✨ ' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("جاري عرض: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "lib-control-btn single-delete-btn";
                    delBtn.style.display = "block";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    
                    var editBtn = document.createElement('button');
                    editBtn.className = "lib-control-btn single-edit-btn";
                    editBtn.style.display = "block";
                    editBtn.innerHTML = "✏️";
                    editBtn.onclick = function(e) { e.stopPropagation(); editSingleEpisode(key, ep.name, ep.url); };

                    item.appendChild(delBtn);
                    item.appendChild(editBtn);
                }
                
                item.appendChild(nameBox);
                container.appendChild(item);
            });
        }

        function editSingleEpisode(key, oldName, oldUrl) {
            var newName = prompt("تعديل اسم المقطع:", oldName);
            if (newName === null) return;
            var newUrl = prompt("تعديل رابط المقطع:", oldUrl);
            if (newUrl === null) return;
            if (newName.trim() === "" || newUrl.trim() === "") { alert("لا يمكن ترك الحقول فارغة"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم التعديل ✅"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة نهائياً؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم المسح"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: تعمل ✅";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: متوقفة ❌";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل البيانات كاملة"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("أُضيف إلى الكواكب: " + name);
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التغيير ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("إيقاف البث فوراً؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
