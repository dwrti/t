<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دورتي الكرتونية 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* ستايل عالم الكرتون */
        :root {
            --bg-color: #1a1b2e; /* أزرق ليلي غامق */
            --card-bg: #2d2d44;
            --accent-blue: #4facfe;
            --accent-green: #00f2fe;
            --cartoon-border: #3f4069;
            --text-color: #a0d8ff;
            --btn-red: #ff4bb5; /* وردي كرتوني بدلاً من الأحمر */
            --btn-blue: #48c6ef;
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }

        body {
            display: flex; flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at 20% 30%, #252641 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, #252641 0%, transparent 40%);
        }

        /* إطار المشغل الكرتوني */
        .card { 
            background: var(--card-bg); 
            padding: 10px; 
            border-radius: 0 0 30px 30px; 
            width: 100%; max-width: 650px; box-sizing: border-box;
            border: 4px solid var(--cartoon-border);
            border-top: none;
            z-index: 10;
            position: sticky; top: 0; 
            box-shadow: 0 10px 0 #121225;
        }
        
        video { 
            width: 100%; 
            display: block; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 20px;
        }

        #admin { display: none; width: 95%; max-width: 650px; margin-top: 25px; }
        
        #viewerCount {
            background: #363753;
            color: var(--accent-green);
            padding: 10px;
            border-radius: 15px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            border: 3px solid var(--cartoon-border);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border: 3px solid var(--cartoon-border); 
            border-radius: 15px; 
            font-size: 14px; background: #1f2035; color: var(--accent-blue);
            box-sizing: border-box; outline: none;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--accent-blue); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        button { 
            flex: 1; min-width: 100px; padding: 12px; 
            background-color: var(--btn-blue); 
            color: #1a1b2e; border: none; 
            border-radius: 15px; 
            cursor: pointer; font-size: 14px; font-weight: 800;
            box-shadow: 0 5px 0 #2a8db0;
            transition: all 0.1s;
        }

        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #2a8db0; }

        .btn-sync.active { background-color: #00dbde; box-shadow: 0 5px 0 #00aeb1; }
        .btn-sync.inactive { background-color: #fc6076; box-shadow: 0 5px 0 #c74b5c; color: white; }
        .btn-delete { background-color: #616283; box-shadow: 0 5px 0 #3f4069; color: #ffb4b4; }

        #statusText { text-align: center; font-size: 13px; color: var(--accent-green); margin: 10px 0; font-weight: bold; }
        
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        /* قسم المكتبة الكرتوني */
        #librarySection {
            width: 95%; max-width: 650px; 
            margin: 40px auto 100px auto; 
            background: var(--card-bg); border-radius: 25px; 
            border: 4px solid var(--cartoon-border);
            padding: 20px; box-sizing: border-box; display: none;
            box-shadow: 0 10px 0 #121225;
        }
        
        .lib-title { 
            font-size: 18px; margin-bottom: 15px; 
            color: var(--accent-blue); font-weight: bold; 
            text-align: center; border-bottom: 2px dashed var(--cartoon-border);
            padding-bottom: 10px;
        }

        .ep-item { 
            display: flex; align-items: center; 
            background: #363753; margin-bottom: 12px; border-radius: 18px;
            border: 3px solid var(--cartoon-border); overflow: hidden;
            flex-direction: row-reverse;
            transition: all 0.2s;
        }
        
        .ep-item:hover { border-color: var(--accent-blue); background: #3d3e5e; }

        .ep-name-clickable {
            flex-grow: 1; padding: 18px;
            cursor: pointer; text-align: right;
        }

        .ep-name-text { 
            color: var(--accent-blue) !important; 
            font-size: 16px; font-weight: bold;
            display: block !important;
        }

        .lib-control-btn {
            background: #1f2035; border: none; 
            height: 45px; width: 45px; font-size: 18px; 
            cursor: pointer; display: none; margin: 5px;
            border-radius: 12px; box-shadow: 0 3px 0 #000;
        }
        
        .single-delete-btn { color: #ff6b6b; }
        .single-edit-btn { color: var(--accent-green); }
        
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">جاري رصد المتابعين... 🔍</div>

        <input type="text" id="urlInput" placeholder="ضع رابط البث هنا..." onpaste="handlePaste(event)">
        
        <div style="border-top: 3px dashed var(--cartoon-border); margin-top: 15px; padding-top: 15px;">
            <input type="text" id="epNameInput" placeholder="اسم الحلقة الجديد">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو">
            <button style="background: var(--accent-blue); color: #1a1b2e; width: 100%; border: none; margin-top: 8px; box-shadow: 0 5px 0 #2a8db0;" onclick="addEpisode()">إضافة للمكتبة 📥</button>
        </div>

        <div class="btn-group" style="margin-top: 15px; border-top: 3px dashed var(--cartoon-border); padding-top: 15px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">انتظر...</button>
            <button class="btn-delete" onclick="deleteVideo()">إفراغ المشغل 🗑️</button>
        </div>
        <div id="statusText">جاهز ✅</div>
    </div>

    <div id="librarySection">
        <div class="lib-title">🎬 مكتبة الحلقات</div> 
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // ... (نفس الكود البرمجي الخاص بك بدون تعديل لضمان استقرار الوظائف)
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "المتابعون الآن: " + count + " 👥";
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#555;'>المكتبة فارغة حالياً</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("تم اختيار: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "lib-control-btn single-delete-btn";
                    delBtn.style.display = "block";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    
                    var editBtn = document.createElement('button');
                    editBtn.className = "lib-control-btn single-edit-btn";
                    editBtn.style.display = "block";
                    editBtn.innerHTML = "✏️";
                    editBtn.onclick = function(e) { e.stopPropagation(); editSingleEpisode(key, ep.name, ep.url); };

                    item.appendChild(delBtn);
                    item.appendChild(editBtn);
                }
                
                item.appendChild(nameBox);
                container.appendChild(item);
            });
        }

        function editSingleEpisode(key, oldName, oldUrl) {
            var newName = prompt("تعديل اسم المقطع:", oldName);
            if (newName === null) return;
            var newUrl = prompt("تعديل رابط المقطع:", oldUrl);
            if (newUrl === null) return;
            if (newName.trim() === "" || newUrl.trim() === "") { alert("لا يمكن ترك الحقول فارغة"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم التحديث ✅"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("حذف هذه الحلقة؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم الحذف 🗑️"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: تعمل 🔗";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: متوقفة ⚡";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) { alert("أدخل الاسم والرابط"); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة بنجاح 💫");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("تم التغيير ✅");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("تصفير المشغل؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
