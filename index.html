<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عالم الديجيتال 📺</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* ستايل أبطال الديجيتال 3 */
        :root {
            --digi-red: #e61a1a;
            --digi-gold: #ffd700;
            --digi-blue: #00d4ff;
            --digi-dark: #0a0a0c;
            --digi-panel: #1a1a1f;
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--digi-dark); 
            background-image: radial-gradient(circle, #1a1a2e 1px, transparent 1px);
            background-size: 30px 30px; /* خلفية شبكية رقمية */
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }

        body { display: flex; flex-direction: column; align-items: center; }

        /* إطار المشغل المستوحى من الـ D-Ark */
        .card { 
            background: #000; padding: 10px; border-radius: 0 0 30px 30px; 
            width: 100%; max-width: 650px; box-sizing: border-box;
            border: 4px solid var(--digi-red);
            border-top: none;
            box-shadow: 0 0 20px rgba(230, 26, 26, 0.4);
            z-index: 10;
            position: sticky; top: 0; 
        }
        
        video { 
            width: 100%; display: block; aspect-ratio: 16/9; 
            background: #000; border-radius: 15px;
            border: 2px solid #333;
        }

        #admin { 
            display: none; width: 95%; max-width: 650px; margin-top: 20px; 
            background: var(--digi-panel); padding: 15px; border-radius: 15px;
            border: 1px solid var(--digi-red);
        }
        
        #viewerCount {
            background: #000; color: var(--digi-blue);
            padding: 8px; border-radius: 8px; text-align: center;
            font-size: 14px; margin-bottom: 10px;
            border: 1px solid var(--digi-blue);
            font-family: monospace; text-transform: uppercase;
        }

        input { 
            width: 100%; padding: 12px; margin: 6px 0; 
            border: 1px solid #444; border-radius: 8px; 
            font-size: 14px; background: #000; color: var(--digi-gold);
            box-sizing: border-box; outline: none;
        }

        button { 
            flex: 1; min-width: 100px; padding: 12px; background-color: #333; 
            color: #fff; border: 2px solid #555; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: all 0.3s;
        }

        button:hover { filter: brightness(1.2); }

        .btn-sync.active { background-color: #1b5e20; border-color: #4caf50; }
        .btn-sync.inactive { background-color: #b71c1c; border-color: #ff5252; }
        .btn-delete { color: #ff5252; border-color: #721c24; }

        #statusText { 
            text-align: center; font-size: 13px; color: var(--digi-gold); 
            margin: 10px 0; font-weight: bold; text-shadow: 0 0 5px rgba(255,215,0,0.5);
        }
        
        h2, p, span:not(.ep-name-text), h3 { display: none !important; }

        #librarySection {
            width: 95%; max-width: 650px; 
            margin: 40px auto 100px auto; 
            background: var(--digi-panel); border-radius: 20px; 
            border: 2px solid var(--digi-gold);
            padding: 15px; box-sizing: border-box; display: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        
        .lib-title { 
            font-size: 18px; margin-bottom: 15px; text-align: center;
            color: var(--digi-gold); font-weight: bold; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .lib-title::after { content: " [ DATABASE ]"; font-size: 12px; }

        .ep-item { 
            display: flex; align-items: center; 
            background: #000; margin-bottom: 10px; border-radius: 12px;
            border: 1px solid #444; overflow: hidden;
            flex-direction: row-reverse; transition: 0.2s;
        }
        
        .ep-item:hover { border-color: var(--digi-blue); transform: translateX(-5px); }

        .ep-name-clickable {
            flex-grow: 1; padding: 15px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            text-align: right;
        }

        .ep-name-text { 
            color: #fff !important; font-size: 15px; 
            display: block !important;
        }

        .lib-control-btn {
            background: #222; border: none; height: 50px; font-size: 16px; 
            cursor: pointer; display: none; flex-shrink: 0; padding: 0 15px;
        }
        
        .single-delete-btn { color: #ff4444; border-left: 1px solid #333; }
        .single-edit-btn { color: var(--digi-blue); border-left: 1px solid #333; }
        
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <div id="viewerCount">البحث عن المروّضين...</div>

        <input type="text" id="urlInput" placeholder="رابط البث الرقمي (M3U8)..." onpaste="handlePaste(event)">
        
        <div style="border-top: 2px solid var(--digi-red); margin-top: 15px; padding-top: 15px;">
            <input type="text" id="epNameInput" placeholder="اسم الحلقة / المهمة">
            <input type="text" id="epUrlInput" placeholder="رابط الفيديو المباشر...">
            <button style="background: var(--digi-red); color: white; width: 100%; border: none; margin-top: 5px; box-shadow: 0 4px 0 #8b0000;" onclick="addEpisode()">تخزين في القاعدة +</button>
        </div>

        <div class="btn-group" style="margin-top: 15px; display: flex; gap: 10px;">
            <button id="syncToggleBtn" class="btn-sync" onclick="toggleSync()">اتصال الشبكة...</button>
            <button class="btn-delete" onclick="deleteVideo()">قطع الإشارة 🗑️</button>
        </div>
        <div id="statusText">النظام جاهز ✅</div>
    </div>

    <div id="librarySection">
        <div class="lib-title">سجل البيانات</div> 
        <div id="episodesContainer" class="ep-list"></div>
    </div>

    <script>
        // الأكواد البرمجية كما هي لضمان عمل الصفحة
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";
        var presenceUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/presence";
        var lastUrl = ""; 
        var isAdmin = window.location.hash === "#ana";
        var isSyncEnabled = true;
        var myUserId = Math.random().toString(36).substring(7);

        function updatePresence() {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", presenceUrl + "/" + myUserId + ".json", true);
            xhr.send(JSON.stringify(Date.now()));
        }

        function fetchViewerCount() {
            if (!isAdmin) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", presenceUrl + ".json", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var count = 0;
                    var now = Date.now();
                    if (data) {
                        Object.keys(data).forEach(function(key) {
                            if (now - data[key] < 10000) count++;
                            else if (now - data[key] > 60000) {
                                var delXhr = new XMLHttpRequest();
                                delXhr.open("DELETE", presenceUrl + "/" + key + ".json", true);
                                delXhr.send();
                            }
                        });
                    }
                    document.getElementById('viewerCount').innerText = "المروّضون المتصلون: " + count;
                }
            };
            xhr.send();
        }

        function playMedia(url) {
            if (!url) { videoElement.src = ""; if (hls) hls.destroy(); lastUrl = ""; return; }
            if (url === lastUrl) return;
            lastUrl = url;
            if (Hls.isSupported() && (url.includes('m3u8') || url.includes('.ts'))) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(videoElement);
            } else { videoElement.src = url; }
            videoElement.play().catch(function(e){});
        }

        function renderLibrary(libData) {
            var container = document.getElementById('episodesContainer');
            container.innerHTML = "";
            if (!libData) { 
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#666; display:block !important;'>قاعدة البيانات فارغة</div>"; 
                return; 
            }
            
            Object.keys(libData).forEach(function(key) {
                var ep = libData[key];
                var item = document.createElement('div');
                item.className = "ep-item";
                
                var nameBox = document.createElement('div');
                nameBox.className = "ep-name-clickable";
                nameBox.innerHTML = '<span class="ep-name-text">🔹 ' + ep.name + '</span>';
                nameBox.onclick = function() { 
                    if (isAdmin) {
                        var xhr = new XMLHttpRequest();
                        xhr.open("PATCH", dbUrl, true);
                        xhr.send(JSON.stringify({ url: ep.url, status: "playing", time: 0 }));
                        showStatus("تحميل البيانات: " + ep.name);
                    }
                    playMedia(ep.url); 
                    window.scrollTo({top: 0, behavior: 'smooth'}); 
                };

                if (isAdmin) {
                    var delBtn = document.createElement('button');
                    delBtn.className = "lib-control-btn single-delete-btn";
                    delBtn.style.display = "block";
                    delBtn.innerHTML = "✕";
                    delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleEpisode(key); };
                    
                    var editBtn = document.createElement('button');
                    editBtn.className = "lib-control-btn single-edit-btn";
                    editBtn.style.display = "block";
                    editBtn.innerHTML = "✏️";
                    editBtn.onclick = function(e) { e.stopPropagation(); editSingleEpisode(key, ep.name, ep.url); };

                    item.appendChild(delBtn);
                    item.appendChild(editBtn);
                }
                
                item.appendChild(nameBox);
                container.appendChild(item);
            });
        }

        function editSingleEpisode(key, oldName, oldUrl) {
            var newName = prompt("تعديل اسم البيانات:", oldName);
            if (newName === null) return;
            var newUrl = prompt("تعديل الرابط الرقمي:", oldUrl);
            if (newUrl === null) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
            xhr.onload = function() { showStatus("تم تعديل البيانات ✅"); loadStream(); };
            xhr.send(JSON.stringify({ name: newName, url: newUrl }));
        }

        function deleteSingleEpisode(key) {
            if(confirm("مسح هذه البيانات؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("DELETE", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library/" + key + ".json", true);
                xhr.onload = function() { showStatus("تم المسح"); loadStream(); };
                xhr.send();
            }
        }

        function syncPlayer(data) {
            if (!data) return;
            isSyncEnabled = data.syncEnabled !== false; 
            updateSyncButtonUI();
            var lib = document.getElementById('librarySection');
            if (isAdmin || !isSyncEnabled) {
                lib.style.display = "block";
                renderLibrary(data.library);
            } else {
                lib.style.display = "none";
            }
            if (isSyncEnabled && !isAdmin) {
                if (data.url !== lastUrl) playMedia(data.url);
                if (Math.abs(videoElement.currentTime - data.time) > 3) videoElement.currentTime = data.time;
                if (data.status === "playing" && videoElement.paused) videoElement.play().catch(function(e){});
                else if (data.status === "paused" && !videoElement.paused) videoElement.pause();
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    syncPlayer(data);
                }
            };
            xhr.send();
        }

        function toggleSync() {
            if (!isAdmin) return;
            isSyncEnabled = !isSyncEnabled;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            xhr.send(JSON.stringify({ syncEnabled: isSyncEnabled }));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            var btn = document.getElementById('syncToggleBtn');
            if (btn) {
                if (isSyncEnabled) {
                    btn.innerText = "المزامنة: متصلة 📶";
                    btn.className = "btn-sync active";
                } else {
                    btn.innerText = "المزامنة: مقطوعة ⚠️";
                    btn.className = "btn-sync inactive";
                }
            }
        }

        function addEpisode() {
            var name = document.getElementById('epNameInput').value.trim();
            var url = document.getElementById('epUrlInput').value.trim();
            if (!name || !url) return;
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream/library.json", true);
            xhr.onload = function() {
                document.getElementById('epNameInput').value = "";
                document.getElementById('epUrlInput').value = "";
                showStatus("تمت الإضافة للقاعدة ✅");
                loadStream();
            };
            xhr.send(JSON.stringify({ name: name, url: url }));
        }

        function updateDatabaseState() {
            if (!isAdmin || !isSyncEnabled) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", dbUrl, true);
            var state = { status: videoElement.paused ? "paused" : "playing", time: videoElement.currentTime };
            xhr.send(JSON.stringify(state));
        }

        setInterval(function() {
            updatePresence();
            if (!isAdmin) loadStream();
            else { 
                if (isSyncEnabled) updateDatabaseState(); 
                loadStream();
                fetchViewerCount();
            }
        }, 5000);

        if (isAdmin) {
            ['play', 'pause', 'seeked'].forEach(function(ev) {
                videoElement.addEventListener(ev, function() { if(isSyncEnabled) updateDatabaseState(); });
            });
        }

        function handlePaste(event) {
            setTimeout(function() {
                var val = document.getElementById('urlInput').value.trim();
                if (val) {
                    var xhr = new XMLHttpRequest();
                    xhr.open("PATCH", dbUrl, true);
                    xhr.send(JSON.stringify({ url: val, status: "playing", time: 0 }));
                    document.getElementById('urlInput').value = ''; 
                    showStatus("جاري البث الرقمي...");
                }
            }, 100);
        }

        function deleteVideo() {
            if(confirm("قطع إشارة البث؟")) {
                var xhr = new XMLHttpRequest();
                xhr.open("PATCH", dbUrl, true);
                xhr.send(JSON.stringify({ url: "", status: "paused", time: 0 }));
            }
        }

        function showStatus(msg) {
            var status = document.getElementById('statusText');
            status.innerText = msg;
            status.style.display = "block";
            setTimeout(function() { status.style.display = "none"; }, 3000);
        }

        window.onload = function() {
            loadStream();
            updatePresence();
            if(isAdmin) {
                document.getElementById('admin').style.display = "block";
                fetchViewerCount();
            }
        };
    </script>
</body>
</html>
