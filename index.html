<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #050505; color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            overflow: hidden;
        }

        .card { 
            background: #111; 
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); 
            width: 95%; 
            max-width: 650px; 
            box-sizing: border-box;
            border: 1px solid #222;
        }
        
        video { 
            width: 100%; 
            border-radius: 8px; 
            background: #000; 
            aspect-ratio: 16/9;
            display: block;
        }

        #admin { 
            display: none; 
            width: 95%;
            max-width: 650px;
            margin-top: 15px;
        }
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0; 
            border: 1px solid #333; 
            border-radius: 8px; 
            font-size: 16px; 
            background: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
            text-align: center;
        }
        
        /* تم تعديل لون الزر هنا ليكون داكن */
        button { 
            width: 100%;
            padding: 12px; 
            background-color: #222; 
            color: #555;
            border: 1px solid #333; 
            border-radius: 8px; 
            cursor: pointer; 
            height: 45px;
        }

        h2, p, span, h3 { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <video id="myPlayer" controls autoplay playsinline></video>
    </div>

    <div id="admin">
        <input type="text" id="urlInput" placeholder="...">
        <button onclick="updateData()"></button>
    </div>

    <script>
        var videoElement = document.getElementById('myPlayer');
        var hls = new Hls();
        var dbUrl = "https://axnt-68677-default-rtdb.europe-west1.firebasedatabase.app/live_stream.json";

        function playMedia(url) {
            if (!url) return;
            if (Hls.isSupported() && url.includes('m3u8')) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoElement.play().catch(function(e){});
                });
            } else {
                videoElement.src = url;
                videoElement.play().catch(function(e){});
            }
        }

        function loadStream() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", dbUrl, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if (data && data.url) {
                        playMedia(data.url);
                    }
                }
            };
            xhr.send();
        }

        function updateData() {
            var val = document.getElementById('urlInput').value.trim();
            if (!val) return;
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", dbUrl, true);
            xhr.onload = function () {
                loadStream();
            };
            xhr.send(JSON.stringify({ url: val }));
        }

        window.onload = function() {
            loadStream();
            if(window.location.hash === "#ana") {
                document.getElementById('admin').style.display = "block";
            }
        };
    </script>
</body>
</html>
